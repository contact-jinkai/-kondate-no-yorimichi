<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#426649"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="献立のよりみち"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>献立のよりみち</title><style>
:root{--green:#426649;--ink:#283c30;--muted:#738075;--paper:#faf9f3;--line:#e2e6dc;--pale:#edf1e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,'Noto Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #c18647;outline-offset:3px}header{padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:#fffdf7}header>div{max-width:1100px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;letter-spacing:.08em;font-weight:700}.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted)}.badge,.chip{display:inline-block;border-radius:30px;background:var(--pale);color:var(--green);padding:4px 12px;font-size:12px}.layout{max-width:1100px;margin:36px auto 100px;padding:0 28px;display:grid;grid-template-columns:190px 1fr;gap:45px}nav button{width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-radius:12px;margin:4px 0;font-weight:600}nav button.active{background:var(--green);color:white}nav p{font-size:12px;color:var(--muted);padding:18px 12px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:700}h1{font-size:30px;line-height:1.45;font-weight:650;margin:6px 0 9px;letter-spacing:.03em}p{margin:8px 0}.sub{color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.hero-icon{font-size:60px;background:#edf0df;border-radius:50%;width:100px;height:100px;text-align:center;line-height:100px;transform:rotate(-8deg)}.panel{background:white;border:1px solid var(--line);padding:22px;border-radius:16px;margin:18px 0}.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.day{background:white;border:1px solid var(--line);border-radius:15px;display:grid;grid-template-columns:55px 1fr;gap:18px;padding:20px;margin:12px 0}.weekday{color:var(--green);font-weight:700;text-align:center;font-size:20px;border-right:1px solid var(--line);padding-right:18px}.weekday small{display:block;font-size:10px;color:var(--muted)}.dish{display:block;border:0;background:none;text-align:left;padding:3px 0;font-weight:600;font-size:16px}.dish:hover{text-decoration:underline}.label{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-right:8px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px}.btn{flex-shrink:0;white-space:nowrap;border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;font-size:13px}.primary{background:var(--green);color:white;border-color:var(--green)}.textbtn{background:none;border:0;font-size:12px;text-decoration:underline;color:var(--muted)}h2{font-size:19px;margin:5px 0 15px}h3{font-size:15px;margin:22px 0 10px}.listrow{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-width:0 0 1px;text-align:left}.circle{border:1.5px solid #aab8a7;border-radius:50%;height:24px;width:24px;flex-shrink:0;text-align:center}.qty{margin-left:auto;color:var(--muted);font-size:13px}.bought{opacity:.6}.bought .circle{background:var(--green);color:white}.bought .itemname{text-decoration:line-through}label.field{display:block;margin:14px 0}input[type=number],textarea,select,input[type=text]{border:1px solid #ccd5c8;border-radius:9px;padding:10px;background:#fff;width:100%;color:var(--ink)}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.check{display:block;padding:7px 0}.check input{accent-color:var(--green);margin-right:8px}dialog{border:0;border-radius:20px;padding:0;max-width:620px;width:calc(100% - 24px);max-height:90vh;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#1a302a88}.modalhead{position:sticky;top:0;padding:16px 22px;background:var(--paper);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}.modalbody{padding:22px}.close{border:0;background:var(--pale);width:36px;height:36px;border-radius:50%;font-size:20px}.step{display:grid;grid-template-columns:30px 1fr;gap:12px;margin:16px 0}.num{background:var(--pale);border-radius:50%;width:28px;height:28px;text-align:center;color:var(--green)}.note{font-size:12px;color:var(--muted);background:var(--pale);padding:14px;border-radius:10px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:12px;padding:12px 22px;z-index:10;box-shadow:0 4px 20px #0002}.progress{height:6px;background:var(--pale);border-radius:8px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:var(--green)}a{color:var(--green)}@media(max-width:720px){header>div{padding:15px 20px}.brand{font-size:18px}.layout{display:block;margin:24px auto 90px;padding:0 18px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf7;display:flex;z-index:5;border-top:1px solid var(--line);padding:7px 10px env(safe-area-inset-bottom)}nav button{width:33.3%;font-size:12px;text-align:center;padding:12px 2px;margin:0}nav p{display:none}.hero-icon{width:70px;height:70px;line-height:70px;font-size:42px}h1{font-size:25px}.hero{gap:12px}.day{padding:17px 14px;gap:12px;grid-template-columns:39px 1fr}.weekday{padding-right:12px;font-size:18px}.dish{font-size:14px}.btn{padding:8px 11px}.panel{padding:18px}.toast{bottom:85px;white-space:nowrap;font-size:13px}}</style></head><body><header><div><div class="brand">♧ 献立のよりみち<small>JINKAI · YOUR EVERYDAY TABLE</small></div><button class="btn" onclick="installHelp()">ホーム画面に追加</button></div></header><div class="layout"><nav aria-label="メイン"><button data-tab="week" class="active">▦　1週間の献立</button><button data-tab="shop">✓　買い物メモ</button><button data-tab="settings">⚙　食材と条件</button><p>決める、買う、つくる。<br>毎日の食卓に、少しの余白。</p></nav><main id="app"></main></div><dialog id="modal"><div class="modalhead"><span id="mtitle">作り方</span><button class="close" aria-label="閉じる" onclick="document.querySelector('dialog').close()">×</button></div><div class="modalbody" id="mbody"></div></dialog><div id="toast" role="status" hidden class="toast"></div><script>
const foods={pork:['豚ひき肉','g','肉・魚'],salmon:['生鮭（無塩）','切れ','肉・魚'],spinach:['冷凍ほうれん草','g','冷凍・パック野菜'],onion:['冷凍玉ねぎスライス','g','冷凍・パック野菜'],eggplant:['冷凍揚げナス','g','冷凍・パック野菜'],mushroom:['冷凍しいたけ','g','冷凍・パック野菜'],sweet:['冷凍さつまいも','g','冷凍・パック野菜'],tofu:['絹豆腐','g','その他'],egg:['卵','個','その他']};
const recipes=[
{n:'豚とナスのしょうが炒め',kind:'コンロ',ing:{pork:200,eggplant:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、おろし生姜 小さじ1',steps:['フライパンに油を入れ、中火で豚ひき肉をほぐしながら炒める。','玉ねぎ・ナスを凍ったまま加え、ふたをして蒸し焼きにする。ときどき混ぜる。','豚肉の中心まで十分に火を通し、生姜・しょうゆ・酢を加えて炒め合わせる。'],tip:'生姜と酢を香りのアクセントに。'},
{n:'鮭としいたけの蒸し焼き',kind:'コンロ',ing:{salmon:2,mushroom:100,onion:100},season:'水 大さじ3、油 小さじ1、レモン汁 小さじ2、黒こしょう 少々',steps:['フライパンに油を入れ、鮭の両面に軽く焼き色をつける。','凍った玉ねぎ・しいたけと水を加え、ふたをして弱めの中火で蒸す。','鮭の中心まで火が通ったら、レモン汁とこしょうを加える。'],tip:'無塩の鮭を使い、レモンの酸味で味を整える。'},
{n:'豚そぼろと豆腐のとろみ煮',kind:'コンロ',ing:{pork:200,tofu:300,mushroom:100},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1、片栗粉 小さじ2＋水 小さじ2',steps:['フライパンで豚ひき肉をほぐしながら炒める。','しいたけ・だし・生姜と、スプーンですくった豆腐を加えて煮る。','豚肉に十分火が通ったらしょうゆを加え、水溶き片栗粉を回し入れて再び煮立てる。'],tip:'豆腐はスプーンですくえば包丁いらず。'},
{n:'豚と玉ねぎのごま酢炒め',kind:'コンロ',ing:{pork:200,onion:200,mushroom:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ2、すりごま 小さじ2',steps:['油を熱したフライパンで豚ひき肉を炒める。','凍った玉ねぎ・しいたけを加え、ふたをして加熱する。','肉と野菜に火が通ったら、しょうゆ・酢・ごまを加えて混ぜる。'],tip:'ごまの香りを仕上げに足す。'},
{n:'豚とほうれん草の卵とじ',kind:'コンロ',ing:{pork:200,spinach:150,egg:2},season:'無塩だし 100ml、しょうゆ 小さじ1、油 小さじ1',steps:['フライパンに油を入れ、豚ひき肉を炒める。','だしと凍ったほうれん草を加え、肉の中心まで火を通す。','しょうゆと溶き卵を加え、ふたをして卵が固まるまで加熱する。'],tip:'主菜に野菜を組み合わせる日。'},
{n:'ナスと豆腐のそぼろ煮',kind:'コンロ',ing:{pork:200,eggplant:150,tofu:300},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1',steps:['豚ひき肉をフライパンでほぐしながら炒める。','凍ったナス・だし・生姜・しょうゆを加え、豆腐をスプーンですくって入れる。','ふたをして煮て、豚肉とナスの中心まで十分に火を通す。'],tip:'やわらかさは食べる人に合わせて調整する。'},
{n:'豚としいたけの香ばし炒め',kind:'コンロ',ing:{pork:200,mushroom:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、黒こしょう 少々',steps:['油を熱し、豚ひき肉を広げて焼き、焼き色がついたらほぐす。','凍ったしいたけと玉ねぎを加えてふたをし、ときどき混ぜる。','全体に十分火を通し、しょうゆ・酢・こしょうを加える。'],tip:'焼き色の香ばしさを活かす。'},
{n:'ほうれん草のごま和え',kind:'レンジ',ing:{spinach:150},season:'すりごま 小さじ2、しょうゆ 小さじ1/2',steps:['凍ったほうれん草を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に加熱し、冷たい部分があれば追加加熱する。','蒸気に気をつけて開け、水気を切り、ごまとしょうゆを混ぜる。'],tip:'野菜を手軽に足せる一品。'},
{n:'さつまいものレモン和え',kind:'レンジ',ing:{sweet:200},season:'水 大さじ1、レモン汁 小さじ1',steps:['冷凍さつまいもと水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、中心まで温まりやわらかくなるまで加熱する。','蒸気に気をつけて開け、レモン汁をからめる。'],tip:'さつまいもを使う副菜。主食量は食事全体で調整。'},
{n:'ナスとしいたけのおかか和え',kind:'レンジ',ing:{eggplant:100,mushroom:100},season:'かつお節 2g、しょうゆ 小さじ1/2、酢 小さじ1',steps:['凍ったナス・しいたけを耐熱容器に入れ、ふんわりラップをする。','それぞれの袋の表示を目安に、全体が温まるまで加熱する。','水気を軽く切り、かつお節・しょうゆ・酢を混ぜる。'],tip:'かつお節の風味を足す。'},
{n:'玉ねぎとほうれん草の温サラダ',kind:'レンジ',ing:{onion:100,spinach:100},season:'水 大さじ1、酢 小さじ1、すりごま 小さじ2',steps:['凍った玉ねぎ・ほうれん草と水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、玉ねぎがやわらかくなるまで加熱する。','水気を切り、酢とごまで和える。'],tip:'玉ねぎの甘みとごまの香りを楽しむ。'}];
const defaults={people:2,days:7,pantry:['pork','spinach','onion','eggplant','mushroom','sweet'],stock:'豚ひき肉6回分\n冷凍：さつまいも、ほうれん草、玉ねぎスライス、揚げナス、しいたけ\nグリル野菜ミックス少量',priority:'包丁なし・減塩を意識・主菜と副菜の2品',week:[[0,7],[1,8],[2,9],[3,7],[4,8],[5,10],[6,7]],bought:{},extras:[]};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem('kondate-v1')||'{}')}}catch{state=structuredClone(defaults)}let tab='week';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('kondate-v1',JSON.stringify(state))}catch{toast('保存できませんでした。ブラウザの設定を確認してください')}};function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,2600)}function head(ey,title,sub,icon){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="hero-icon" aria-hidden="true">${icon}</div></div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='week')renderWeek();else if(tab==='shop')renderShop();else renderSettings()}
function renderWeek(){app.innerHTML=head('WEEKLY MENU','今週、なに食べよう。','料理名をタップして、作り方を見てみよう。','🥬')+`<div class="strip"><span class="chip">${state.people}人分・夕食${state.days}日</span><span class="chip">主菜＋副菜</span><span class="chip">包丁なし</span></div><p class="note">サンプル献立です。AI自動生成は未接続。条件変更では人数・日数が反映され、献立の差し替えを試せます。</p>`+state.week.slice(0,state.days).map(([a,b],i)=>`<article class="day"><div class="weekday">${'月火水木金土日'[i]}<small>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</small></div><div><button class="dish" onclick="recipe(${a})"><span class="label">主菜</span>${recipes[a].n}　›</button><button class="dish" onclick="recipe(${b})"><span class="label">副菜</span>${recipes[b].n}　›</button><div class="actions"><button class="btn" onclick="together(${i})">◷ 2品いっしょに作る</button><button class="textbtn" onclick="swap(${i})">献立を変更</button></div></div></article>`).join('')+`<p class="sub">15分を目標にした構成です。量・機器・解凍状態で時間は変わります。</p><button class="btn primary" onclick="go('shop')">買い物メモを見る →</button>`}
function groceries(){let total={};state.week.slice(0,state.days).flat().forEach(id=>Object.entries(recipes[id].ing).forEach(([k,v])=>total[k]=(total[k]||0)+v*state.people/2));return Object.entries(total).filter(([k])=>!state.pantry.includes(k)).map(([k,v])=>({id:k,n:foods[k][0],q:Math.ceil(v)+foods[k][1],cat:foods[k][2]})).concat(state.extras.map((n,i)=>({id:'extra'+i,n,q:'',cat:'追加したもの'})))}
function renderShop(){const items=groceries(),done=items.filter(x=>state.bought[x.id]),left=items.filter(x=>!state.bought[x.id]);app.innerHTML=head('SHOPPING LIST','買うものだけ、ひと目で。','買ったらタップ。購入済みから、いつでも戻せます。','🧺')+`<div class="panel"><div class="actions"><strong>あと ${left.length} 品</strong><span class="sub">${done.length} / ${items.length} 品 購入済み</span></div><div class="progress"><div style="width:${items.length?done.length/items.length*100:0}%"></div></div><p class="sub">家にある食材は除外しています。残量は未計算のため、不足分は「食材と条件」でチェックを外してください。</p></div>`+['肉・魚','冷凍・パック野菜','その他','追加したもの'].map(cat=>{const a=left.filter(x=>x.cat===cat);return a.length?`<h3>${cat}</h3><div class="panel">${a.map(row).join('')}</div>`:''}).join('')+(!left.length?'<div class="panel">✓ 買い物メモの残りはありません。</div>':'')+`<form id="addform" class="actions"><input type="text" id="extra" aria-label="買い物を追加" placeholder="牛乳など、買うものを追加" maxlength="80" required><button class="btn" type="submit">追加</button></form><details class="panel" ${done.length?'open':''}><summary>購入済み（${done.length}品）・タップで戻す</summary>${done.map(row).join('')}</details><div class="note">調味料・主食は自宅の在庫を確認してください。使用する調味料：油、しょうゆ、酢、生姜、ごま、レモン汁、黒こしょう、無塩だし、片栗粉、かつお節。<br>在庫にないものは上の欄から追加できます。</div>`;document.querySelector('#addform').onsubmit=e=>{e.preventDefault();state.extras.push(document.querySelector('#extra').value.trim());save();renderShop();toast('買い物メモに追加しました')}}
function row(x){return `<button class="listrow ${state.bought[x.id]?'bought':''}" onclick="buy('${x.id}')" aria-label="${esc(x.n)}を${state.bought[x.id]?'未購入に戻す':'購入済みにする'}"><span class="circle">${state.bought[x.id]?'✓':''}</span><span class="itemname">${esc(x.n)}</span><span class="qty">${x.q}</span></button>`}function buy(k){state.bought[k]=!state.bought[k];save();renderShop()}
function renderSettings(){app.innerHTML=head('MY KITCHEN','わが家の食材と条件。','いつもの希望を、ここにひとまとめ。','🥣')+`<form id="settings"><div class="panel"><h2>何人分、何日分？</h2><div class="fields"><label class="field">人数<input id="people" type="number" min="1" max="8" value="${state.people}" required></label><label class="field">日数<select id="days">${[1,2,3,4,5,6,7].map(n=>`<option ${n===state.days?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div class="panel"><h2>家にある食材</h2><p class="sub">チェックした食材は買い物メモから除外します。</p>${Object.entries(foods).map(([k,v])=>`<label class="check"><input type="checkbox" name="pantry" value="${k}" ${state.pantry.includes(k)?'checked':''}>${v[0]}</label>`).join('')}<label class="field">家にある食材・残っている量<textarea id="stock">${esc(state.stock)}</textarea></label><p class="sub">いま自宅にある食材の量を書いておく欄です（例：豚ひき肉6回分、ほうれん草半袋）。買い物メモへの残量の自動反映は未対応です。</p></div><div class="panel"><h2>献立で大切にしたいこと</h2><textarea id="priority">${esc(state.priority)}</textarea><p class="sub">この欄は希望の保存用です。サンプル献立の自動生成には反映されません。</p><div class="strip" style="margin:14px 0 0"><span class="chip">肉1種・魚1種</span><span class="chip">冷凍野菜中心</span><span class="chip">コンロ＋レンジ</span></div></div><button class="btn primary" type="submit">保存して献立へ →</button><p class="sub">入力内容・購入チェックはこのブラウザ内に保存されます。AIへの送信機能はありません。</p></form>`;document.querySelector('#settings').onsubmit=e=>{e.preventDefault();state.people=Number(document.querySelector('#people').value);state.days=Number(document.querySelector('#days').value);state.pantry=[...document.querySelectorAll('[name=pantry]:checked')].map(x=>x.value);state.stock=document.querySelector('#stock').value;state.priority=document.querySelector('#priority').value;state.bought={};save();go('week');toast('人数・日数と食材を保存しました')}}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));function modal(title,body){document.querySelector('#mtitle').textContent=title;document.querySelector('#mbody').innerHTML=body;document.querySelector('#modal').showModal()}function ingredients(r){return Object.entries(r.ing).map(([k,v])=>`<div class="listrow"><span>${foods[k][0]}</span><span class="qty">${Math.ceil(v*state.people/2)}${foods[k][1]}</span></div>`).join('')}const safety='<p class="note">レンジは耐熱容器＋ふんわりラップでの手順です。アイラップ版の手順は未対応。冷凍食品は商品の加熱表示を優先してください。肉・魚は時間だけで判断せず中心まで十分に加熱。分量を増やす場合は加熱時間も調整します。</p>';
function recipe(id){const r=recipes[id];modal('作り方',`<span class="chip">${r.kind} ・ ${state.people}人分</span><h1>${r.n}</h1><h3>材料</h3>${ingredients(r)}<p class="sub">調味料（2人分）：${r.season}<br>現在の人数では上記の${state.people/2}倍が目安です。</p><h3>作り方</h3>${r.steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div>${s}</div></div>`).join('')}<p class="note">${r.tip}</p>${safety}`)}
function together(i){const [a,b]=state.week[i],m=recipes[a],s=recipes[b];modal('2品いっしょに作る',`<span class="chip">${'月火水木金土日'[i]}曜日 ・ ${state.people}人分</span><h1>コンロとレンジで、<br>いっしょに。</h1><p>${m.n}<br>＋ ${s.n}</p><p class="sub">15分は目標です。完了時間より、食材に十分火が通ることを優先してください。</p><h3>まず、材料を用意</h3><details class="panel"><summary>2品の材料・調味料を見る</summary><h3>${m.n}</h3>${ingredients(m)}<p class="sub">調味料（2人分）：${m.season}</p><h3>${s.n}</h3>${ingredients(s)}<p class="sub">調味料（2人分）：${s.season}</p><p class="sub">調味料は${state.people/2}倍に調整。</p></details>${[['準備', '材料と調味料をそろえ、副菜用の耐熱容器を出す。'],['コンロ｜主菜をスタート',m.steps[0]],['レンジ｜副菜を加熱',s.steps[0]+' '+s.steps[1]],['コンロ｜主菜を仕上げる',m.steps.slice(1).join(' ')],['副菜を和えて、盛りつけ',s.steps[2]]].map(([t,s],j)=>`<div class="step"><span class="num">${j+1}</span><div><strong>${t}</strong><p>${s}</p></div></div>`).join('')}${safety}`)}
function swap(i){modal('献立を変更',`<h2>${'月火水木金土日'[i]}曜日の料理を選ぶ</h2><form id="swapform"><label class="field">主菜<select id="mainchoice">${recipes.slice(0,7).map((r,j)=>`<option value="${j}" ${state.week[i][0]===j?'selected':''}>${r.n}</option>`).join('')}</select></label><label class="field">副菜<select id="sidechoice">${recipes.slice(7).map((r,j)=>`<option value="${j+7}" ${state.week[i][1]===j+7?'selected':''}>${r.n}</option>`).join('')}</select></label><p class="sub">買い物メモの分量も更新されます。購入チェックは保持されます。</p><button class="btn primary">この献立にする</button></form>`);document.querySelector('#swapform').onsubmit=e=>{e.preventDefault();state.week[i]=[Number(document.querySelector('#mainchoice').value),Number(document.querySelector('#sidechoice').value)];save();document.querySelector('#modal').close();render();toast('献立と買い物メモを更新しました')}}render();
function installHelp(){modal('ホーム画面に追加',`<h2>いつものアプリのように開く</h2><p>iPhoneでは、このページをSafariで開いてから追加してください。</p><ol><li>Safariの共有メニューを開く。</li><li>「ホーム画面に追加」を選ぶ。</li><li>「Webアプリとして開く」をオンにして「追加」。</li></ol><p class="note">利用にはインターネット接続と、必要に応じてChatGPTへのログインが必要です。AI献立生成は未接続の試用版です。</p><p class="sub">入力・購入チェックは使っているブラウザ／アプリ内に保存されます。別端末との同期はありません。Safariでの入力がホーム画面版に引き継がれない場合は、追加後のアプリで入力してください。</p><a href="https://support.apple.com/ja-jp/guide/iphone/iphea86e5236/ios" target="_blank" rel="noopener noreferrer">Appleの追加手順</a>`)}if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){document.querySelector('header .btn').hidden=true;}
</script></body></html>
