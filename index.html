<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#426649"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="献立のよりみち"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>献立のよりみち</title><style>
:root{--green:#426649;--ink:#283c30;--muted:#738075;--paper:#faf9f3;--line:#e2e6dc;--pale:#edf1e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,'Noto Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #c18647;outline-offset:3px}header{padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:#fffdf7}header>div{max-width:1100px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;letter-spacing:.08em;font-weight:700}.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted)}.badge,.chip{display:inline-block;border-radius:30px;background:var(--pale);color:var(--green);padding:4px 12px;font-size:12px}.layout{max-width:1100px;margin:36px auto 100px;padding:0 28px;display:grid;grid-template-columns:190px 1fr;gap:45px}nav button{width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-radius:12px;margin:4px 0;font-weight:600}nav button.active{background:var(--green);color:white}nav p{font-size:12px;color:var(--muted);padding:18px 12px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:700}h1{font-size:30px;line-height:1.45;font-weight:650;margin:6px 0 9px;letter-spacing:.03em}p{margin:8px 0}.sub{color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.hero-icon{font-size:60px;background:#edf0df;border-radius:50%;width:100px;height:100px;text-align:center;line-height:100px;transform:rotate(-8deg)}.panel{background:white;border:1px solid var(--line);padding:22px;border-radius:16px;margin:18px 0}.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.day{background:white;border:1px solid var(--line);border-radius:15px;display:grid;grid-template-columns:55px 1fr;gap:18px;padding isplay:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}.modalbody{padding:22px}.close{border:0;background:var(--pale);width:36px;height:36px;border-radius:50%;font-size:20px}.step{display:grid;grid-template-columns:30px 1fr;gap:12px;margin:16px 0}.num{background:var(--pale);border-radius:50%;width:28px;height:28px;text-align:center;color:var(--green)}.note{font-size:12px;color:var(--muted);background:var(--pale);padding:14px;border-radius:10px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:12px;padding:12px 22px;z-index:10;box-shadow:0 4px 20px #0002}.progress{height:6px;background:var(--pale);border-radius:8px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:var(--green)}a{color:var(--green)}@media(max-width:720px){header>div{padding:15px 20px}.brand{font-size:18px}.layout{display:block;margin:24px auto 90px;padding:0 18px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf7;display:flex;z-index:5;border-top:1px solid var(--line);padding:7px 10px env(safe-area-inset-bottom)}nav button{width:33.3%;font-size:12px;text-align:center;padding:12px 2px;margin:0}nav p{display:none}.hero-icon{width:70px;height:70px;line-height:70px;font-size:42px}h1{font-size:25px}.hero{gap:12px}.day{padding:17px 14px;gap:12px;grid-template-columns:39px 1fr}.weekday{padding-right:12px;font-size:18px}.dish{font-size:14px}.btn{padding:8px 11px}.panel{padding:18px}.toast{bottom:85px;white-space:nowrap;font-size:13px}}.priority-group{border:0;border-top:1px solid var(--line);padding:14px 0;margin:16px 0}.priority-group legend{font-size:14px;font-weight:600;padding-right:12px}.priority-options{display:flex;flex-wrap:wrap;gap:10px}.priority-option{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px;font-size:14px}.priority-option:has(input:checked){background:var(--pale);border-color:var(--green)}.priority-option input{width:18px;height:18px;accent-color:var(--green);flex-shrink:0}input,select,textarea{font-size:16px}.shop-row{display:flex;gap:8px;align-items:center}.shop-row .listrow{flex:1;min-width:0}.shop-row .qty{white-space:nowrap}.qty-edit{padding:8px;font-size:12px}.cook-step{display:flex;gap:14px;align-items:flex-start;background:white;border:1px solid var(--line);padding:16px;border-radius:12px;margin:12px 0;cursor:pointer}.cook-step input{width:24px;height:24px;flex-shrink:0;accent-color:var(--green);margin-top:2px}.cook-step.done{background:var(--pale)}.cook-step.done strong{text-decoration:line-through}.cook-step p{font-size:14px}.hero{flex-wrap:wrap}@media(max-width:450px){header>div{gap:10px;flex-wrap:wrap}.brand{font-size:17px}.hero-icon{display:none}.qty-edit{font-size:11px}.shop-row .qty{max-width:90px;white-space:normal}.actions{flex-wrap:wrap}}.favorite-toggle.selected{background:var(--pale);border-color:var(--green)}.locked-day{border-color:var(--green)}button:disabled{opacity:.45;cursor:default}@media(max-width:720px){nav button{width:25%;font-size:11px}}.priority-option small{display:block}</style></head><body><header><div><div class="brand">♧ 献立のよりみち<small>JINKAI · YOUR EVERYDAY TABLE</small></div><button class="btn" onclick="installHelp()">ホーム画面に追加</button></div></header><div class="layout"><nav aria-label="メイン"><button data-tab="week" class="active">▦　1週間の献立</button><button data-tab="shop">✓　買い物メモ</button><button data-tab="favorites">♡　お気に入り</button><button data-tab="settings">⚙　食材と条件</button><p>決める、買う、つくる。<br>毎日の食卓に、少しの余白。</p></nav><main id="app"></main></div><dialog id="modal"><div class="modalhead"><span id="mtitle">作り方</span><button class="close" aria-label="閉じる" onclick="document.querySelector('dialog').close()">×</button></div><div class="modalbody" id="mbody"></div></dialog><div id="toast" role="status" hidden class="toast"></div><script>
const foods={pork:['豚ひき肉','g','肉・魚'],salmon:['生鮭（無塩）','切れ','肉・魚'],spinach:['冷凍ほうれん草','g','冷凍・パック野菜'],onion:['冷凍玉ねぎスライス','g','冷凍・パック野菜'],eggplant:['冷凍揚げナス','g','冷凍・パック野菜'],mushroom:['冷凍しいたけ','g','冷凍・パック野菜'],sweet:['冷凍さつまいも','g','冷凍・パック野菜'],tofu:['絹豆腐','g','その他'],egg:['卵','個','その他']};
const recipes=[
{n:'豚とナスのしょうが炒め',kind:'コンロ',ing:{pork:200,eggplant:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、おろし生姜 小さじ1',steps:['フライパンに油を入れ、中火で豚ひき肉をほぐしながら炒める。','玉ねぎ・ナスを凍ったまま加え、ふたをして蒸し焼きにする。ときどき混ぜる。','豚肉の中心まで十分に火を通し、生姜・しょうゆ・酢を加えて炒め合わせる。'],tip:'生姜と酢を香りのアクセントに。'},
{n:'鮭としいたけの蒸し焼き',kind:'コンロ',ing:{salmon:2,mushroom:100,onion:100},season:'水 大さじ3、油 小さじ1、レモン汁 小さじ2、黒こしょう 少々',steps:['フライパンに油を入れ、鮭の両面に軽く焼き色をつける。','凍った玉ねぎ・しいたけと水を加え、ふたをして弱めの中火で蒸す。','鮭の中心まで火が通ったら、レモン汁とこしょうを加える。'],tip:'無塩の鮭を使い、レモンの酸味で味を整える。'},
{n:'豚そぼろと豆腐のとろみ煮',kind:'コンロ',ing:{pork:200,tofu:300,mushroom:100},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1、片栗粉 小さじ2＋水 小さじ2',steps:['フライパンで豚ひき肉をほぐしながら炒める。','しいたけ・だし・生姜と、スプーンですくった豆腐を加えて煮る。','豚肉に十分火が通ったらしょうゆを加え、水溶き片栗粉を回し入れて再び煮立てる。'],tip:'豆腐はスプーンですくえば包丁いらず。'},
{n:'豚と玉ねぎのごま酢炒め',kind:'コンロ',ing:{pork:200,onion:200,mushroom:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ2、すりごま 小さじ2',steps:['油を熱したフライパンで豚ひき肉を炒める。','凍った玉ねぎ・しいたけを加え、ふたをして加熱する。','肉と野菜に火が通ったら、しょうゆ・酢・ごまを加えて混ぜる。'],tip:'ごまの香りを仕上げに足す。'},
{n:'豚とほうれん草の卵とじ',kind:'コンロ',ing:{pork:200,spinach:150,egg:2},season:'無塩だし 100ml、しょうゆ 小さじ1、油 小さじ1',steps:['フライパンに油を入れ、豚ひき肉を炒める。','だしと凍ったほうれん草を加え、肉の中心まで火を通す。','しょうゆと溶き卵を加え、ふたをして卵が固まるまで加熱する。'],tip:'主菜に野菜を組み合わせる日。'},
{n:'ナスと豆腐のそぼろ煮',kind:'コンロ',ing:{pork:200,eggplant:150,tofu:300},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1',steps:['豚ひき肉をフライパンでほぐしながら炒める。','凍ったナス・だし・生姜・しょうゆを加え、豆腐をスプーンですくって入れる。','ふたをして煮て、豚肉とナスの中心まで十分に火を通す。'],tip:'やわらかさは食べる人に合わせて調整する。'},
{n:'豚としいたけの香ばし炒め',kind:'コンロ',ing:{pork:200,mushroom:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、黒こしょう 少々',steps:['油を熱し、豚ひき肉を広げて焼き、焼き色がついたらほぐす。','凍ったしいたけと玉ねぎを加えてふたをし、ときどき混ぜる。','全体に十分火を通し、しょうゆ・酢・こしょうを加える。'],tip:'焼き色の香ばしさを活かす。'},
{n:'ほうれん草のごま和え',kind:'レンジ',ing:{spinach:150},season:'すりごま 小さじ2、しょうゆ 小さじ1/2',steps:['凍ったほうれん草を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に加熱し、冷たい部分があれば追加加熱する。','蒸気に気をつけて開け、水気を切り、ごまとしょうゆを混ぜる。'],tip:'野菜を手軽に足せる一品。'},
{n:'さつまいものレモン和え',kind:'レンジ',ing:{sweet:200},season:'水 大さじ1、レモン汁 小さじ1',steps:['冷凍さつまいもと水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、中心まで温まりやわらかくなるまで加熱する。','蒸気に気をつけて開け、レモン汁をからめる。'],tip:'さつまいもを使う副菜。主食量は食事全体で調整。'},
{n:'ナスとしいたけのおかか和え',kind:'レンジ',ing:{eggplant:100,mushroom:100},season:'かつお節 2g、しょうゆ 小さじ1/2、酢 小さじ1',steps:['凍ったナス・しいたけを耐熱容器に入れ、ふんわりラップをする。','それぞれの袋の表示を目安に、全体が温まるまで加熱する。','水気を軽く切り、かつお節・しょうゆ・酢を混ぜる。'],tip:'かつお節の風味を足す。'},
{n:'玉ねぎとほうれん草の温サラダ',kind:'レンジ',ing:{onion:100,spinach:100},season:'水 大さじ1、酢 小さじ1、すりごま 小さじ2',steps:['凍った玉ねぎ・ほうれん草と水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、玉ねぎがやわらかくなるまで加熱する。','水気を切り、酢とごまで和える。'],tip:'玉ねぎの甘みとごまの香りを楽しむ。'}];
const priorityGroups=[["調理をラクに",[["noKnife","包丁なし"],["quick","15分以内を目標"],["frozen","冷凍・カット野菜中心"],["parallel","コンロ＋レンジで同時調理"],["twoDishes","主菜と副菜の2品"]]],["買い物を少なく",[["fewFoods","食材の種類を少なく"],["useStock","家にある食材を優先"],["oneMeatFish","買う肉1種・魚1種"]]],["食事で意識したいこと",[["lowSalt","減塩を意識"],["soft","噛みやすさを意識"],["folate","葉酸を意識"],["vitamins","ビタミンを意識"],["zinc","亜鉛を意識"],["balance","3色食品群のバランス"]]],["料理の好み",[["japanese","和食"],["western","洋食"],["chinese","中華"],["italian","イタリアン"]]]];
const defaults={people:2,days:7,pantry:['pork','spinach','onion','eggplant','mushroom','sweet'],stock:'豚ひき肉6回分\n冷凍：さつまいも、ほうれん草、玉ねぎスライス、揚げナス、しいたけ\nグリル野菜ミックス少量',priority:'包丁なし・減塩を意識・主菜と副菜の2品',week:[[0,7],[1,8],[2,9],[3,7],[4,8],[5,10],[6,7]],bought:{},extras:[]};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem('kondate-v1')||'{}')}}catch{state=structuredClone(defaults)}if(!Array.isArray(state.priorityChoices)){const previous=state.priority||'';state.priorityChoices=priorityGroups.flatMap(g=>g[1]).filter(([id,label])=>previous.includes(label.replace('を意識',''))).map(x=>x[0]);state.priorityNote=previous;}if(typeof state.priorityNote!=='string')state.priorityNote='';state.quantityOverrides=state.quantityOverrides||{};state.seasonItems=state.seasonItems||[];state.cooking=state.cooking||{};state.menuNotices=state.menuNotices||[];state.generation=state.generation||0;state.lockedDays=state.lockedDays||{};state.favoriteIds=Array.isArray(state.favoriteIds)?state.favoriteIds:[];state.purchasedItems=state.purchasedItems||{};state.preferBought=state.preferBought!==false;state.preferFavorites=state.preferFavorites!==false;let tab='week';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('kondate-v1',JSON.stringify(state))}catch{toast('保存できませんでした。ブラウザの設定を確認してください')}};function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,2600)}function head(ey,title,sub,icon){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="hero-icon" aria-hidden="true">${icon}</div></div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='week')renderWeek();else if(tab==='shop')renderShop();else if(tab==='favorites')renderFavorites();else renderSettings()}
function renderWeek(){app.innerHTML=head('WEEKLY MENU','今週、なに食べよう。','料理名をタップして、作り方を見てみよう。','🥬')+`<div class="strip"><span class="chip">${state.people}人分・夕食${state.days}日</span><span class="chip">主菜＋副菜</span><span class="chip">包丁なし</span></div>${planInfo()}`+state.week.slice(0,state.days).map(([a,b],i)=>`<article class="day"><div class="weekday">${'月火水木金土日'[i]}<small>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</small></div><div><button class="dish" onclick="recipe(${a})"><span class="label">主菜</span>${recipes[a].n}　›</button><button class="dish" onclick="recipe(${b})"><span class="label">副菜</span>${recipes[b].n}　›</button><div class="actions"><button class="btn" onclick="together(${i})">◷ 2品いっしょに作る</button><button class="textbtn" onclick="swap(${i})">献立を変更</button></div></div></article>`).join('')+`<p class="sub">調理時間は目安です。量・機器・解凍状態で変わります。各日の「2品いっしょに作る」で確認できます。</p><button class="btn primary" onclick="go('shop')">買い物メモを見る →</button>`}
function groceries(){let total={};state.week.slice(0,state.days).flat().forEach(id=>Object.entries(recipes[id].ing).forEach(([k,v])=>total[k]=(total[k]||0)+v*state.people/2));return Object.entries(total).filter(([k])=>!state.pantry.includes(k)).map(([k,v])=>({id:k,n:foods[k][0],q:Math.ceil(v)+foods[k][1],cat:foods[k][2]})).concat(state.extras.map((n,i)=>({id:'extra'+i,n,q:'',cat:'追加したもの'})))}
function renderShop(){const items=groceries(),done=items.filter(x=>state.bought[x.id]),left=items.filter(x=>!state.bought[x.id]);app.innerHTML=head('SHOPPING LIST','買うものだけ、ひと目で。','買ったらタップ。購入済みから、いつでも戻せます。','🧺')+`<div class="panel"><div class="actions"><strong>あと ${left.length} 品</strong><span class="sub">${done.length} / ${items.length} 品 購入済み</span></div><div class="progress"><div style="width:${items.length?done.length/items.length*100:0}%"></div></div><p class="sub">家にある食材は除外しています。残量は未計算のため、不足分は「食材と条件」でチェックを外してください。</p></div><div id="season-panel">${seasonPanel()}</div>`+['肉・魚','冷凍・パック野菜','その他','調味料','追加したもの'].map(cat=>{const a=left.filter(x=>x.cat===cat);return a.length?`<h3>${cat}</h3><div class="panel">${a.map(row).join('')}</div>`:''}).join('')+(!left.length?'<div class="panel">✓ 買い物メモの残りはありません。</div>':'')+`<form id="addform" class="actions"><input type="text" id="extra" aria-label="買い物を追加" placeholder="牛乳など、買うものを追加" maxlength="80" required><button class="btn" type="submit">追加</button></form><details class="panel" ${done.length?'open':''}><summary>購入済み（${done.length}品）・タップで戻す</summary>${done.map(row).join('')}</details><p class="sub">主食は必要に応じて買い物メモに追加してください。</p>`;document.querySelector('#addform').onsubmit=e=>{e.preventDefault();state.extras.push(document.querySelector('#extra').value.trim());save();renderShop();toast('買い物メモに追加しました')}}
function row(x){return `<button class="listrow ${state.bought[x.id]?'bought':''}" onclick="buy('${x.id}')" aria-label="${esc(x.n)}を${state.bought[x.id]?'未購入に戻す':'購入済みにする'}"><span class="circle">${state.bought[x.id]?'✓':''}</span><span class="itemname">${esc(x.n)}</span><span class="qty">${x.q}</span></button>`}function buy(k){const item=groceries().find(x=>x.id===k);state.bought[k]=!state.bought[k];if(state.bought[k]&&item)state.purchasedItems[k]={...item};save();renderShop()}

function renderSettings(){app.innerHTML=head('MY KITCHEN','わが家の食材と条件。','いつもの希望を、ここにひとまとめ。','🥣')+`<form id="settings"><div class="panel"><h2>何人分、何日分？</h2><div class="fields"><label class="field">人数<input id="people" type="number" min="1" max="8" value="${state.people}" required></label><label class="field">日数<select id="days">${[1,2,3,4,5,6,7].map(n=>`<option ${n===state.days?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div class="panel"><h2>家にある食材</h2><p class="sub">チェックした食材は買い物メモから除外します。</p>${Object.entries(foods).map(([k,v])=>`<label class="check"><input type="checkbox" name="pantry" value="${k}" ${state.pantry.includes(k)?'checked':''}>${v[0]}</label>`).join('')}<label class="field">家にある食材・残っている量<textarea id="stock">${esc(state.stock)}</textarea></label><p class="sub">いま自宅にある食材の量を書いておく欄です（例：豚ひき肉6回分、ほうれん草半袋）。このメモの量は計算に使いません。</p></div><div class="panel"><h2>献立で大切にしたいこと</h2><p class="sub">当てはまるものを、いくつでも選べます。</p>${priorityFields()}<label class="field">その他の希望（任意）<textarea id="priorityNote" placeholder="選択肢にない希望はこちらへ">${esc(state.priorityNote)}</textarea></label><p class="sub">選択内容を保存したあと、献立画面の「条件に合わせて献立を作る」で組み直せます。「その他の希望」は記録用です。</p></div><button class="btn primary" type="submit">条件を保存して献立へ →</button><p class="sub">入力内容・購入チェックはこのブラウザ内に保存されます。AIへの送信機能はありません。</p></form>`;document.querySelector('#settings').onsubmit=e=>{e.preventDefault();rememberPurchases();state.people=Number(document.querySelector('#people').value);state.days=Number(document.querySelector('#days').value);state.pantry=[...document.querySelectorAll('[name=pantry]:checked')].map(x=>x.value);state.stock=document.querySelector('#stock').value;state.priorityChoices=[...document.querySelectorAll('[name=priorityChoice]:checked')].map(x=>x.value);state.priorityNote=document.querySelector('#priorityNote').value;save();go('week');toast('人数・日数と食材を保存しました')}}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));function modal(title,body){document.querySelector('#mtitle').textContent=title;document.querySelector('#mbody').innerHTML=body;document.querySelector('#modal').showModal()}function ingredients(r){return Object.entries(r.ing).map(([k,v])=>`<div class="listrow"><span>${foods[k][0]}</span><span class="qty">${Math.ceil(v*state.people/2)}${foods[k][1]}</span></div>`).join('')}const safety='<p class="note">レンジは耐熱容器＋ふんわりラップでの手順です。アイラップ版の手順は未対応。冷凍食品は商品の加熱表示を優先してください。肉・魚は時間だけで判断せず中心まで十分に加熱。分量を増やす場合は加熱時間も調整します。</p>';
function recipe(id){const r=recipes[id];modal('作り方',`<span class="chip">${r.kind} ・ ${state.people}人分</span><h1>${r.n}</h1><h3>材料</h3>${ingredients(r)}<p class="sub">調味料（2人分）：${r.season}<br>現在の人数では上記の${state.people/2}倍が目安です。</p><h3>作り方</h3>${r.steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div>${s}</div></div>`).join('')}<p class="note">${r.tip}</p>${safety}`)}
function together(i){const [a,b]=state.week[i],m=recipes[a],s=recipes[b];modal('2品いっしょに作る',`<span class="chip">${'月火水木金土日'[i]}曜日 ・ ${state.people}人分</span><h1>コンロとレンジで、<br>いっしょに。</h1><p>${m.n}<br>＋ ${s.n}</p><p class="sub">15分は目標です。完了時間より、食材に十分火が通ることを優先してください。</p><h3>まず、材料を用意</h3><details class="panel"><summary>2品の材料・調味料を見る</summary><h3>${m.n}</h3>${ingredients(m)}<p class="sub">調味料（${state.people}人分）：${scaledSeason(m)}</p><h3>${s.n}</h3>${ingredients(s)}<p class="sub">調味料（${state.people}人分）：${scaledSeason(s)}</p></details>${[['準備', '材料と調味料をそろえ、副菜用の耐熱容器を出す。'],['コンロ｜主菜をスタート',m.steps[0]],['レンジ｜副菜を加熱',s.steps[0]+' '+s.steps[1]],['コンロ｜主菜を仕上げる',m.steps.slice(1).join(' ')],['副菜を和えて、盛りつけ',s.steps[2]]].map(([t,s],j)=>`<div class="step"><span class="num">${j+1}</span><div><strong>${t}</strong><p>${s}</p></div></div>`).join('')}${safety}`)}
function swap(i){if(state.lockedDays[i]){toast('先に固定を解除してください');return;}modal('献立を変更',`<h2>${'月火水木金土日'[i]}曜日の料理を選ぶ</h2><form id="swapform"><label class="field">主菜<select id="mainchoice">${recipes.slice(0,7).map((r,j)=>`<option value="${j}" ${state.week[i][0]===j?'selected':''}>${r.n}</option>`).join('')}</select></label><label class="field">副菜<select id="sidechoice">${recipes.slice(7).map((r,j)=>`<option value="${j+7}" ${state.week[i][1]===j+7?'selected':''}>${r.n}</option>`).join('')}</select></label><p class="sub">買い物メモの分量も更新されます。購入チェックは保持されます。</p><button class="btn primary">この献立にする</button></form>`);document.querySelector('#swapform').onsubmit=e=>{e.preventDefault();state.week[i]=[Number(document.querySelector('#mainchoice').value),Number(document.querySelector('#sidechoice').value)];save();document.querySelector('#modal').close();render();toast('献立と買い物メモを更新しました')}}

recipes.forEach((r,i)=>{r.role=i<7?'main':'side';r.cuisine='japanese';r.minutes=i===2||i===5?20:15;r.tags=['noKnife','frozen','lowSalt'];if(i===2||i===5||i===8)r.tags.push('soft');});
const original=recipes.slice();
for(const cuisine of ['western','chinese','italian'])original.forEach((r,i)=>{const n=JSON.parse(JSON.stringify(r));n.cuisine=cuisine;n.tags=n.tags.filter(x=>x!=='soft');const main=r.role==='main';
 if(cuisine==='italian'){n.n=main?(i===1?'鮭ときのこのトマト煮':i===4?'豚とほうれん草のトマト卵とじ':r.n.replace(/の.*$/,'')+'のトマトバジル煮'):(i===8?'さつまいものオリーブレモン和え':r.n.replace(/の.*$/,'')+'のオリーブ和え');if(main){n.ing.tomato=150;n.minutes=20;n.season='オリーブ油 小さじ1、無塩トマトピューレ 150g、水 大さじ3、乾燥バジル 少々、黒こしょう 少々';n.steps=['フライパンにオリーブ油を熱し、'+(i===1?'鮭の両面を焼く。':'豚ひき肉をほぐしながら炒める。'),'野菜を凍ったまま加え、トマトピューレと水を入れてふたをする。'+(n.ing.tofu?'豆腐はスプーンですくって加える。':''),'トマトをよく煮込み、肉・魚の中心まで十分に加熱する。'+(n.ing.egg?'溶き卵を加え、固まるまで加熱する。':'')+'バジルと黒こしょうで仕上げる。'];}else{n.season='オリーブ油 小さじ1、レモン汁 小さじ1、黒こしょう 少々';n.steps[2]='蒸気に注意して開け、水気を切ってオリーブ油・レモン汁・黒こしょうで和える。';}}
 if(cuisine==='western'){n.n=main?r.n.replace(/の.*$/,'')+'のバターレモン蒸し':r.n.replace(/の.*$/,'')+'のレモンバター和え';n.season='無塩バター 5g、レモン汁 小さじ2、水 大さじ3、黒こしょう 少々';if(main)n.steps=['フライパンに無塩バターを溶かし、'+(i===1?'鮭を両面焼く。':'豚ひき肉を炒める。'),'野菜を凍ったまま加え、水を入れてふたをし、蒸し焼きにする。'+(n.ing.tofu?'豆腐をスプーンですくって加える。':''),'肉・魚の中心まで十分に加熱する。'+(n.ing.egg?'溶き卵を加え、固まるまで加熱する。':'')+'レモン汁と黒こしょうで仕上げる。'];else n.steps[2]='蒸気に注意して開け、水気を切って無塩バター・レモン汁・黒こしょうを混ぜる。';}
 if(cuisine==='chinese'){n.n=main?r.n.replace(/の.*$/,'')+'の中華しょうが蒸し':r.n.replace(/の.*$/,'')+'の中華ごま和え';n.season='ごま油 小さじ1、しょうゆ 小さじ1、生姜 小さじ1、酢 小さじ1、水 大さじ3';if(main)n.steps=['フライパンにごま油を熱し、'+(i===1?'鮭を両面焼く。':'豚ひき肉を炒める。'),'野菜を凍ったまま加え、水と生姜を入れてふたをする。'+(n.ing.tofu?'豆腐をスプーンですくって加える。':''),'肉・魚の中心まで十分に加熱する。'+(n.ing.egg?'溶き卵を加え、固まるまで加熱する。':'')+'しょうゆ・酢で味を整える。'];else n.steps[2]='蒸気に注意して開け、水気を切ってごま油・しょうゆ・生姜・酢で和える。';}
 n.tip='香りと酸味を活かした'+({italian:'イタリアン風',western:'洋風',chinese:'中華風'}[cuisine])+'の組み合わせ。栄養量の計算は行っていません。';recipes.push(n);
});
foods.tomato=['無塩トマトピューレ','g','冷凍・パック野菜'];
// Tomato puree belongs in the ingredient list, not twice in the seasoning list.

state.quantityOverrides=state.quantityOverrides||{};state.seasonItems=state.seasonItems||[];state.cooking=state.cooking||{};state.menuNotices=state.menuNotices||[];state.generation=state.generation||0;
function requiredSeasons(){const texts=state.week.slice(0,state.days).flat().map(id=>recipes[id].season);return seasonNames.filter(s=>texts.some(t=>s==='おろし生姜'?/生姜/.test(t):s==='油'?/(^|、)油 /.test(t):s==='片栗粉'?/片栗粉/.test(t):t.includes(s)));}
function generateMenu(){rememberPurchases();const boughtFoods=purchaseFoods();const choices=new Set(state.priorityChoices);const cuisines=['japanese','western','chinese','italian'].filter(c=>choices.has(c));let mains=recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='main'),sides=recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='side');let notices=[];
 if(cuisines.length){mains=mains.filter(x=>cuisines.includes(x.r.cuisine));sides=sides.filter(x=>cuisines.includes(x.r.cuisine));}
 for(const key of ['soft','quick'])if(choices.has(key)){const fit=x=>key==='quick'?x.r.minutes<=15:x.r.tags.includes(key);const a=mains.filter(fit),b=sides.filter(fit);if(a.length&&b.length){mains=a;sides=b;}else notices.push(key==='quick'?'選んだ料理の好みでは15分以内の主菜がないため、20分の候補も含めました。':'噛みやすさの条件に合う候補が足りず、他の候補も含めました。食べる人に合わせて調整してください。');}
 const nutrientKeys={folate:r=>!!r.ing.spinach,vitamins:r=>!!(r.ing.spinach||r.ing.sweet||r.ing.salmon||r.ing.tomato),zinc:r=>!!(r.ing.pork||r.ing.egg)};
 const selectedN=Object.keys(nutrientKeys).filter(k=>choices.has(k));let used={},usedVeg=new Set();let pairs=[];const offset=state.generation++;
 const score=(x,day)=>{const ids=Object.keys(x.r.ing);return (state.preferBought?ids.filter(k=>boughtFoods.has(k)).length*5:0)+(state.preferFavorites&&state.favoriteIds.includes(x.id)?3:0)-8*(used[x.id]||0)+selectedN.filter(k=>nutrientKeys[k](x.r)).length*3+(choices.has('balance')?((x.r.role==='side'&&x.r.ing.sweet)?4:Object.keys(x.r.ing).some(k=>['spinach','onion','eggplant','mushroom','tomato'].includes(k))?1:0):0)+(choices.has('useStock')?ids.filter(k=>state.pantry.includes(k)).length*2:0)+(choices.has('fewFoods')?ids.filter(k=>usedVeg.has(k)).length*2:0)+((x.id+offset+day)%7)/10;};
 for(let day=0;day<7;day++){if(state.lockedDays[day]){const pair=state.week[day].slice();pairs.push(pair);pair.forEach(id=>{used[id]=(used[id]||0)+1;Object.keys(recipes[id].ing).forEach(k=>usedVeg.add(k));});continue;}const a=[...mains].sort((x,y)=>score(y,day)-score(x,day))[0];used[a.id]=(used[a.id]||0)+1;Object.keys(a.r.ing).forEach(k=>usedVeg.add(k));let pool=sides;if(cuisines.length>1&&pool.some(x=>x.r.cuisine===a.r.cuisine))pool=pool.filter(x=>x.r.cuisine===a.r.cuisine);const b=[...pool].sort((x,y)=>score(y,day)-score(x,day))[0];used[b.id]=(used[b.id]||0)+1;Object.keys(b.r.ing).forEach(k=>usedVeg.add(k));pairs.push([a.id,b.id]);}
 if(choices.has('balance'))notices.push('3色食品群は、肉・魚などに野菜やさつまいもを組み合わせる候補を優先しました。主食も含めて食事全体で調整してください。');if(selectedN.length)notices.push('栄養の希望は、該当する食材を含む候補を優先しています。摂取量や必要量を満たす保証はありません。');

 if(Object.values(state.lockedDays).some(Boolean))notices.push('固定した日の献立は、選択した条件より固定を優先しています。');state.week=pairs;state.menuNotices=notices;save();go('week');toast('条件に合わせて献立を組み直しました');}
function planInfo(){const names=priorityGroups.flatMap(g=>g[1]).filter(([id])=>state.priorityChoices.includes(id)).map(x=>x[1]);return '<div class="panel"><p class="sub">登録レシピから組み合わせます。AIへの送信・生成は行いません。「その他の希望」は記録用です。</p><div class="strip">'+names.map(n=>'<span class="chip">'+n+'</span>').join('')+'</div><label class="check"><input type="checkbox" '+(state.preferBought?'checked':'')+' onchange="state.preferBought=this.checked;save()">買った食材を優先</label><label class="check"><input type="checkbox" '+(state.preferFavorites?'checked':'')+' onchange="state.preferFavorites=this.checked;save()">お気に入りを優先</label><button class="btn primary" onclick="confirmGeneration()">条件に合わせて献立を作る</button><p class="sub">固定した日はそのまま。購入チェック・買う量の変更は引き継ぎます。購入済みでも不足しないかは、ご自身で確認してください。</p>'+state.menuNotices.map(n=>'<p class="note">'+n+'</p>').join('')+'</div>';}
function confirmGeneration(){modal('献立を組み直す','<h2>選んだ条件で献立を作る</h2><p>固定していない日の献立を組み直します。購入済み品、買う量の変更、追加した買い物、調理チェックは残ります。</p><button class="btn primary" onclick="document.querySelector(\'dialog\').close();generateMenu()">献立を作る</button>');}
function groceries(){let total={};state.week.slice(0,state.days).flat().forEach(id=>Object.entries(recipes[id].ing).forEach(([k,v])=>total[k]=(total[k]||0)+v*state.people/2));const items=Object.entries(total).filter(([k])=>!state.pantry.includes(k)).map(([k,v])=>({id:k,n:foods[k][0],q:Math.ceil(v)+foods[k][1],cat:foods[k][2]})).concat(state.extras.map((n,i)=>({id:'extra'+i,n,q:'',cat:'追加したもの'})),state.seasonItems.map(s=>({id:'s'+seasonNames.indexOf(s),n:s,q:'必要な分',cat:'調味料'}))).map(x=>({...x,q:state.quantityOverrides[x.id]??(state.bought[x.id]&&state.purchasedItems[x.id]?state.purchasedItems[x.id].q:x.q)}));for(const [id,item] of Object.entries(state.purchasedItems))if(state.bought[id]&&!items.some(x=>x.id===id))items.push({...item,q:state.quantityOverrides[id]??item.q,unused:true});return items;}
function row(x){return `<div class="shop-row"><button class="listrow ${state.bought[x.id]?'bought':''}" onclick="buy('${x.id}')" aria-label="${esc(x.n)}を${state.bought[x.id]?'未購入に戻す':'購入済みにする'}"><span class="circle">${state.bought[x.id]?'✓':''}</span><span class="itemname">${esc(x.n)}${x.unused?'<small class="sub">（今の献立では未使用）</small>':''}</span><span class="qty">${esc(x.q)}</span></button><button class="btn qty-edit" onclick="editQuantity('${x.id}')" aria-label="${esc(x.n)}の数量を変更">数量変更</button></div>`;}
function editQuantity(id){const x=groceries().find(x=>x.id===id);modal('買う量を変更',`<h2>${esc(x.n)}</h2><form id="quantityform"><label class="field">買う量・単位<input id="quantity" type="text" value="${esc(x.q)}" placeholder="例：1パック、300g、2袋" maxlength="60" required></label><p class="sub">買い物メモだけを変更します。レシピの材料・分量は変わりません。</p><button class="btn primary">保存</button><button class="btn" type="button" onclick="delete state.quantityOverrides['${id}'];save();document.querySelector('dialog').close();renderShop()">元の量に戻す</button></form>`);document.querySelector('#quantityform').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#quantity').value.trim();if(!q)return;state.quantityOverrides[id]=q;save();document.querySelector('dialog').close();renderShop();toast('買う量を変更しました');};}
function seasonLabel(s){return s==='おろし生姜'?'生姜（おろし生姜でも可）':s;}
function seasonPanel(){const names=requiredSeasons();return '<section class="panel" aria-labelledby="season-title"><h2 id="season-title">この献立で使う調味料</h2><p class="sub">家にないものにチェックすると、買い物メモに追加されます。チェックを外すと追加を取り消せます。</p><div class="priority-options">'+names.map(s=>'<label class="priority-option"><input type="checkbox" '+(state.seasonItems.includes(s)?'checked':'')+' onchange="toggleSeason('+seasonNames.indexOf(s)+',this.checked)"><span>'+seasonLabel(s)+'</span></label>').join('')+'</div>'+(names.length?'':'<p class="sub">使う調味料はありません。</p>')+'</section>';}
function toggleSeason(i,on){const s=seasonNames[i];state.seasonItems=state.seasonItems.filter(x=>x!==s);if(on){state.seasonItems.push(s);delete state.bought['s'+i];}save();renderShop();toast(on?seasonLabel(s)+'を買い物メモに追加しました':seasonLabel(s)+'の追加を取り消しました');}
function stepKey(i){return 'day:'+i+':'+state.week[i].join('-')+':'+state.people;}
function cookSteps(key,steps){const done=state.cooking[key]||{};return '<p class="sub" id="cook-count">'+Object.values(done).filter(Boolean).length+' / '+steps.length+' 手順完了</p>'+steps.map(([title,text],j)=>`<label class="cook-step ${done[j]?'done':''}"><input type="checkbox" ${done[j]?'checked':''} onchange="checkCooking('${key}',${j},this.checked,${steps.length},this)"><span><strong>${title}</strong><p>${text}</p></span></label>`).join('')+'<p class="sub">チェックはこの端末に保存されます。同じ料理・人数で開くと続きから確認できます。</p>';}
function checkCooking(key,j,on,total,input){state.cooking[key]=state.cooking[key]||{};state.cooking[key][j]=on;save();input.closest('label').classList.toggle('done',on);document.querySelector('#cook-count').textContent=Object.values(state.cooking[key]).filter(Boolean).length+' / '+total+' 手順完了';}
function together(i){const [a,b]=state.week[i],m=recipes[a],s=recipes[b];const steps=[['準備','材料と調味料をそろえ、副菜用の耐熱容器を出す。'],['コンロ｜主菜をスタート',m.steps[0]],['レンジ｜副菜を加熱',s.steps[0]+' '+s.steps[1]],['コンロ｜主菜を仕上げる',m.steps.slice(1).join(' ')],['副菜を和えて、盛りつけ',s.steps[2]]];modal('2品いっしょに作る',`<span class="chip">${'月火水木金土日'[i]}曜日 ・ ${state.people}人分 ・ 目安${m.minutes}〜${m.minutes+5}分</span><h1>ひとつずつ、進めよう。</h1><p>${m.n}<br>＋ ${s.n}</p><details class="panel"><summary>2品の材料・調味料を見る</summary><h3>${m.n}</h3>${ingredients(m)}<p class="sub">調味料（${state.people}人分）：${scaledSeason(m)}</p><h3>${s.n}</h3>${ingredients(s)}<p class="sub">調味料（${state.people}人分）：${scaledSeason(s)}</p></details>${cookSteps(stepKey(i),steps)}${safety}`);}
function swap(i){if(state.lockedDays&&state.lockedDays[i]){toast('先に固定を解除してください');return;}modal('献立を変更',`<h2>${'月火水木金土日'[i]}曜日の料理を選ぶ</h2><form id="swapform"><label class="field">主菜<select id="mainchoice">${recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='main').map(({r,id})=>`<option value="${id}" ${state.week[i][0]===id?'selected':''}>${r.n}</option>`).join('')}</select></label><label class="field">副菜<select id="sidechoice">${recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='side').map(({r,id})=>`<option value="${id}" ${state.week[i][1]===id?'selected':''}>${r.n}</option>`).join('')}</select></label><p class="sub">手動の変更では全候補から選べます。数量変更と購入チェックは引き継ぎます。</p><button class="btn primary">この献立にする</button></form>`);document.querySelector('#swapform').onsubmit=e=>{e.preventDefault();rememberPurchases();state.week[i]=[Number(document.querySelector('#mainchoice').value),Number(document.querySelector('#sidechoice').value)];state.menuNotices=['献立を手動で変更しました。選択した条件を満たすか、作り方を確認してください。'];save();document.querySelector('dialog').close();render();toast('献立と買い物メモを更新しました');};}
render();

function rememberPurchases(){const all=groceries();for(const x of all)if(state.bought[x.id])state.purchasedItems[x.id]={...x};save();}
function purchaseFoods(){return new Set([...Object.keys(state.bought).filter(k=>state.bought[k]),...Object.keys(state.purchasedItems).filter(k=>state.bought[k])].filter(k=>foods[k]));}
function toggleLock(i){state.lockedDays[i]=!state.lockedDays[i];save();renderWeek();toast(state.lockedDays[i]?'この日の献立を固定しました':'固定を解除しました');}
function favoriteButton(id){const on=state.favoriteIds.includes(id);return `<button type="button" class="btn favorite-toggle ${on?'selected':''}" aria-pressed="${on}" onclick="toggleFavorite(${id},this)">${on?'♥ お気に入り済み':'♡ お気に入りに保存'}</button>`;}
function toggleFavorite(id,button){const on=!state.favoriteIds.includes(id);state.favoriteIds=state.favoriteIds.filter(x=>x!==id);if(on)state.favoriteIds.push(id);save();if(button){button.textContent=on?'♥ お気に入り済み':'♡ お気に入りに保存';button.setAttribute('aria-pressed',String(on));button.classList.toggle('selected',on);}if(tab==='favorites')renderFavorites();toast(on?'お気に入りに保存しました':'お気に入りを解除しました');}
function renderFavorites(){app.innerHTML=head('FAVORITES','また食べたい、を残そう。','料理名から作り方を開けます。献立への追加もここから。','♡')+(state.favoriteIds.length?state.favoriteIds.map(id=>`<article class="panel"><span class="chip">${recipes[id].role==='main'?'主菜':'副菜'}</span><button class="dish" onclick="recipe(${id})">${recipes[id].n} ›</button><div class="actions"><button class="btn primary" onclick="chooseFavoriteDay(${id})">献立に入れる</button>${favoriteButton(id)}</div></article>`).join(''):'<div class="panel"><p>まだお気に入りはありません。</p><p class="sub">料理の作り方を開いて「♡ お気に入りに保存」を押してください。</p></div>');}
function chooseFavoriteDay(id){modal('お気に入りを献立に入れる',`<h2>${recipes[id].n}</h2><p class="sub">入れたい日を選んでください。固定した日は、献立画面で固定を解除してから変更できます。</p><div class="priority-options">${state.week.slice(0,state.days).map((pair,i)=>`<button class="btn" ${state.lockedDays[i]?'disabled':''} onclick="placeFavorite(${id},${i})">${'月火水木金土日'[i]}${state.lockedDays[i]?' 🔒':''}</button>`).join('')}</div>`);}
function placeFavorite(id,i){if(state.lockedDays[i])return;rememberPurchases();state.week[i][recipes[id].role==='main'?0:1]=id;state.menuNotices=['お気に入りから献立を変更しました。選択条件を満たすか、作り方を確認してください。'];save();document.querySelector('dialog').close();go('week');toast('献立に追加しました');}
function formatAmount(n){const whole=Math.floor(n),part=Math.round((n-whole)*100)/100;const fractions={0.25:'1/4',0.5:'1/2',0.75:'3/4'};return fractions[part]?(whole?whole+'と':'')+fractions[part]:String(Math.round(n*100)/100);}
function scaledSeason(r){return r.season.replace(/\d+(?:\/\d+|\.\d+)?/g,text=>{const parts=text.split('/');const n=parts.length===2?Number(parts[0])/Number(parts[1]):Number(text);return formatAmount(n*state.people/2);});}
function recipe(id){const r=recipes[id];modal('作り方',`<span class="chip">${r.kind} ・ ${state.people}人分</span><h1>${r.n}</h1>${favoriteButton(id)}<h3>材料</h3>${ingredients(r)}<div class="panel"><h3>調味料（${state.people}人分）</h3><p>${scaledSeason(r)}</p></div><h3>作り方</h3>${r.steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div>${s}</div></div>`).join('')}<p class="note">${r.tip}</p>${safety}`);}
function renderWeek(){app.innerHTML=head('WEEKLY MENU','今週、なに食べよう。','料理名をタップして、作り方を見てみよう。','🥬')+`<div class="strip"><span class="chip">${state.people}人分・夕食${state.days}日</span><span class="chip">主菜＋副菜</span><span class="chip">包丁なし</span></div>${planInfo()}`+state.week.slice(0,state.days).map(([a,b],i)=>`<article class="day ${state.lockedDays[i]?'locked-day':''}"><div class="weekday">${'月火水木金土日'[i]}<small>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</small></div><div><button class="dish" onclick="recipe(${a})"><span class="label">主菜</span>${state.favoriteIds.includes(a)?'♥ ':''}${recipes[a].n}　›</button><button class="dish" onclick="recipe(${b})"><span class="label">副菜</span>${state.favoriteIds.includes(b)?'♥ ':''}${recipes[b].n}　›</button><div class="actions"><button class="btn" onclick="together(${i})">◷ 2品いっしょに作る</button><button class="btn" aria-pressed="${!!state.lockedDays[i]}" onclick="toggleLock(${i})">${state.lockedDays[i]?'🔒 固定中':'固定する'}</button>${state.lockedDays[i]?'':`<button class="textbtn" onclick="swap(${i})">献立を変更</button>`}</div></div></article>`).join('')+`<p class="sub">調理時間は目安です。量・機器・解凍状態で変わります。</p><button class="btn primary" onclick="go('shop')">買い物メモを見る →</button>`;}

render();
</script></body></html>
