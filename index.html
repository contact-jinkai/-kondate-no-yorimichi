function uiIcon(k){const paths={"book": "<path d=\"M12 6C8 3 5 3 2 4v15c4-1 7 0 10 2 3-2 6-3 10-2V4c-3-1-6-1-10 2v15\"/>", "basket": "<path d=\"M3 9h18l-2 11H5L3 9Z\" fill=\"#f2e2cc\"/><path d=\"m7 9 5-6 5 6M9 13v3m6-3v3\"/>", "heart": "<path d=\"M12 21 3 12C-3 5 6-1 12 6 18-1 27 5 21 12Z\" fill=\"#f8d8d0\"/>", "cup": "<path d=\"M4 9h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z\" fill=\"#f7eddb\"/><path d=\"M17 10h2a3 3 0 0 1 0 6h-2M7 5c-1-1 1-2 0-3m4 3c-1-1 1-2 0-3m4 3c-1-1 1-2 0-3\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"5\" fill=\"#f5d786\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5\"/>"};return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+paths[k]+'</svg>';}

const foods={pork:['豚ひき肉','g','肉・魚'],salmon:['生鮭（無塩）','切れ','肉・魚'],spinach:['冷凍ほうれん草','g','冷凍・パック野菜'],onion:['冷凍玉ねぎスライス','g','冷凍・パック野菜'],eggplant:['冷凍揚げナス','g','冷凍・パック野菜'],mushroom:['冷凍しいたけ','g','冷凍・パック野菜'],sweet:['冷凍さつまいも','g','冷凍・パック野菜'],tofu:['絹豆腐','g','その他'],egg:['卵','個','その他']};
const recipes=[
{n:'豚とナスのしょうが炒め',kind:'コンロ',ing:{pork:200,eggplant:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、おろし生姜 小さじ1',steps:['フライパンに油を入れ、中火で豚ひき肉をほぐしながら炒める。','玉ねぎ・ナスを凍ったまま加え、ふたをして蒸し焼きにする。ときどき混ぜる。','豚肉の中心まで十分に火を通し、生姜・しょうゆ・酢を加えて炒め合わせる。'],tip:'生姜と酢を香りのアクセントに。'},
{n:'鮭としいたけの蒸し焼き',kind:'コンロ',ing:{salmon:2,mushroom:100,onion:100},season:'水 大さじ3、油 小さじ1、レモン汁 小さじ2、黒こしょう 少々',steps:['フライパンに油を入れ、鮭の両面に軽く焼き色をつける。','凍った玉ねぎ・しいたけと水を加え、ふたをして弱めの中火で蒸す。','鮭の中心まで火が通ったら、レモン汁とこしょうを加える。'],tip:'無塩の鮭を使い、レモンの酸味で味を整える。'},
{n:'豚そぼろと豆腐のとろみ煮',kind:'コンロ',ing:{pork:200,tofu:300,mushroom:100},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1、片栗粉 小さじ2＋水 小さじ2',steps:['フライパンで豚ひき肉をほぐしながら炒める。','しいたけ・だし・生姜と、スプーンですくった豆腐を加えて煮る。','豚肉に十分火が通ったらしょうゆを加え、水溶き片栗粉を回し入れて再び煮立てる。'],tip:'豆腐はスプーンですくえば包丁いらず。'},
{n:'豚と玉ねぎのごま酢炒め',kind:'コンロ',ing:{pork:200,onion:200,mushroom:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ2、すりごま 小さじ2',steps:['油を熱したフライパンで豚ひき肉を炒める。','凍った玉ねぎ・しいたけを加え、ふたをして加熱する。','肉と野菜に火が通ったら、しょうゆ・酢・ごまを加えて混ぜる。'],tip:'ごまの香りを仕上げに足す。'},
{n:'豚とほうれん草の卵とじ',kind:'コンロ',ing:{pork:200,spinach:150,egg:2},season:'無塩だし 100ml、しょうゆ 小さじ1、油 小さじ1',steps:['フライパンに油を入れ、豚ひき肉を炒める。','だしと凍ったほうれん草を加え、肉の中心まで火を通す。','しょうゆと溶き卵を加え、ふたをして卵が固まるまで加熱する。'],tip:'主菜に野菜を組み合わせる日。'},
{n:'ナスと豆腐のそぼろ煮',kind:'コンロ',ing:{pork:200,eggplant:150,tofu:300},season:'無塩だし 150ml、しょうゆ 小さじ1、生姜 小さじ1',steps:['豚ひき肉をフライパンでほぐしながら炒める。','凍ったナス・だし・生姜・しょうゆを加え、豆腐をスプーンですくって入れる。','ふたをして煮て、豚肉とナスの中心まで十分に火を通す。'],tip:'やわらかさは食べる人に合わせて調整する。'},
{n:'豚としいたけの香ばし炒め',kind:'コンロ',ing:{pork:200,mushroom:150,onion:100},season:'油 小さじ1、しょうゆ 小さじ1、酢 小さじ1、黒こしょう 少々',steps:['油を熱し、豚ひき肉を広げて焼き、焼き色がついたらほぐす。','凍ったしいたけと玉ねぎを加えてふたをし、ときどき混ぜる。','全体に十分火を通し、しょうゆ・酢・こしょうを加える。'],tip:'焼き色の香ばしさを活かす。'},
{n:'ほうれん草のごま和え',kind:'レンジ',ing:{spinach:150},season:'すりごま 小さじ2、しょうゆ 小さじ1/2',steps:['凍ったほうれん草を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に加熱し、冷たい部分があれば追加加熱する。','蒸気に気をつけて開け、水気を切り、ごまとしょうゆを混ぜる。'],tip:'野菜を手軽に足せる一品。'},
{n:'さつまいものレモン和え',kind:'レンジ',ing:{sweet:200},season:'水 大さじ1、レモン汁 小さじ1',steps:['冷凍さつまいもと水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、中心まで温まりやわらかくなるまで加熱する。','蒸気に気をつけて開け、レモン汁をからめる。'],tip:'さつまいもを使う副菜。主食量は食事全体で調整。'},
{n:'ナスとしいたけのおかか和え',kind:'レンジ',ing:{eggplant:100,mushroom:100},season:'かつお節 2g、しょうゆ 小さじ1/2、酢 小さじ1',steps:['凍ったナス・しいたけを耐熱容器に入れ、ふんわりラップをする。','それぞれの袋の表示を目安に、全体が温まるまで加熱する。','水気を軽く切り、かつお節・しょうゆ・酢を混ぜる。'],tip:'かつお節の風味を足す。'},
{n:'玉ねぎとほうれん草の温サラダ',kind:'レンジ',ing:{onion:100,spinach:100},season:'水 大さじ1、酢 小さじ1、すりごま 小さじ2',steps:['凍った玉ねぎ・ほうれん草と水を耐熱容器に入れ、ふんわりラップをする。','袋の表示を目安に、玉ねぎがやわらかくなるまで加熱する。','水気を切り、酢とごまで和える。'],tip:'玉ねぎの甘みとごまの香りを楽しむ。'}];
const priorityGroups=[["調理をラクに",[["noKnife","包丁なし"],["quick","15分以内を目標"],["frozen","冷凍・カット野菜中心"],["parallel","コンロ＋レンジで同時調理"],["twoDishes","主菜と副菜の2品"]]],["買い物を少なく",[["fewFoods","食材の種類を少なく"],["useStock","家にある食材を優先"],["oneMeatFish","買う肉1種・魚1種"]]],["食事で意識したいこと",[["lowSalt","減塩を意識"],["soft","噛みやすさを意識"],["folate","葉酸を意識"],["vitamins","ビタミンを意識"],["zinc","亜鉛を意識"],["balance","3色食品群のバランス"]]],["料理の好み",[["japanese","和食"],["western","洋食"],["chinese","中華"],["italian","イタリアン"]]]];
const defaults={people:2,days:7,pantry:['pork','spinach','onion','eggplant','mushroom','sweet'],stock:'豚ひき肉6回分\n冷凍：さつまいも、ほうれん草、玉ねぎスライス、揚げナス、しいたけ\nグリル野菜ミックス少量',priority:'包丁なし・減塩を意識・主菜と副菜の2品',week:[[0,7],[1,8],[2,9],[3,7],[4,8],[5,10],[6,7]],bought:{},extras:[]};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem('kondate-v1')||'{}')}}catch{state=structuredClone(defaults)}if(!Array.isArray(state.priorityChoices)){const previous=state.priority||'';state.priorityChoices=priorityGroups.flatMap(g=>g[1]).filter(([id,label])=>previous.includes(label.replace('を意識',''))).map(x=>x[0]);state.priorityNote=previous;}if(typeof state.priorityNote!=='string')state.priorityNote='';state.quantityOverrides=state.quantityOverrides||{};state.seasonItems=state.seasonItems||[];state.cooking=state.cooking||{};state.menuNotices=state.menuNotices||[];state.generation=state.generation||0;state.lockedDays=state.lockedDays||{};state.favoriteIds=Array.isArray(state.favoriteIds)?state.favoriteIds:[];state.purchasedItems=state.purchasedItems||{};state.preferBought=state.preferBought!==false;state.preferFavorites=state.preferFavorites!==false;state.ideaSelection=Array.isArray(state.ideaSelection)?state.ideaSelection.filter(id=>Number.isInteger(id)&&id>=0&&id<47):[];state.ideaFilter=state.ideaFilter||'all';state.ideaOnlyPantry=!!state.ideaOnlyPantry;state.ideaOffset=state.ideaOffset||0;let tab='week';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('kondate-v1',JSON.stringify(state))}catch{toast('保存できませんでした。ブラウザの設定を確認してください')}};function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,2600)}function head(ey,title,sub,icon){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="hero-icon" aria-hidden="true">${({ 'WEEKLY MENU':uiIcon('book'), 'SHOPPING LIST':uiIcon('basket'), 'FAVORITES':uiIcon('heart'), 'MY KITCHEN':uiIcon('cup') })[ey]||uiIcon('sun')}</div></div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='week')renderWeek();else if(tab==='shop')renderShop();else if(tab==='favorites')renderFavorites();else renderSettings()}
function renderWeek(){app.innerHTML=head('WEEKLY MENU','今週、なに食べよう。','料理名でレシピ、緑のボタンで2品の調理手順へ。','🥬')+`<figure class="window-card"><img src="./yorimichi-window.jpg" width="1536" height="768" alt="窓辺で猫とくつろぐ女性。緑と青空、あたたかな食卓のイラスト" fetchpriority="high"><figcaption class="window-caption"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#f5d786"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>今日のごはんに、ほっとするよりみち。</figcaption></figure><div class="strip"><span class="chip">${state.people}人分・夕食${state.days}日</span><span class="chip">主菜＋副菜</span><span class="chip">包丁なし</span></div>${planInfo()}`+state.week.slice(0,state.days).map(([a,b],i)=>`<article class="day"><div class="weekday">${'月火水木金土日'[i]}<small>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</small></div><div><button class="dish" onclick="recipe(${a})"><span class="label main-label">主菜</span>${recipes[a].n}　›</button><button class="dish" onclick="recipe(${b})"><span class="label side-label">副菜</span>${recipes[b].n}　›</button><div class="actions"><button class="btn cook-button" onclick="together(${i})">▶ 2品いっしょに作る</button><button class="textbtn" onclick="swap(${i})">献立を変更</button></div></div></article>`).join('')+`<p class="sub">調理時間は目安です。量・機器・解凍状態で変わります。各日の「2品いっしょに作る」で確認できます。</p><button class="btn primary" onclick="go('shop')">買い物メモを見る →</button>`}
function groceries(){let total={};activeRecipeIds().forEach(id=>Object.entries(recipes[id].ing).forEach(([k,v])=>total[k]=(total[k]||0)+v*state.people/2));return Object.entries(total).filter(([k])=>!state.pantry.includes(k)).map(([k,v])=>({id:k,n:foods[k][0],q:Math.ceil(v)+foods[k][1],cat:foods[k][2]})).concat(state.extras.map((n,i)=>({id:'extra'+i,n,q:'',cat:'追加したもの'})))}
function renderShop(){const items=groceries(),done=items.filter(x=>state.bought[x.id]),left=items.filter(x=>!state.bought[x.id]);app.innerHTML=head('SHOPPING LIST','買うものだけ、ひと目で。','① 調味料を確認 → ② 買ったものをチェック','🧺')+`<div class="panel"><div class="actions"><strong>あと ${left.length} 品</strong><span class="sub">${done.length} / ${items.length} 品 購入済み</span></div><div class="progress"><div style="width:${items.length?done.length/items.length*100:0}%"></div></div><p class="sub">家にある食材は除外しています。残量は未計算のため、不足分は「食材と条件」でチェックを外してください。</p></div><div id="season-panel">${seasonPanel()}</div><h2 class="section-heading">② 買うもの<span>買ったら丸にチェック</span></h2>`+['肉・魚','冷凍・パック野菜','その他','調味料','追加したもの'].map(cat=>{const a=left.filter(x=>x.cat===cat);return a.length?`<h3>${cat}</h3><div class="panel">${a.map(row).join('')}</div>`:''}).join('')+(!left.length?'<div class="panel">✓ 買い物メモの残りはありません。</div>':'')+`<form id="addform" class="actions"><input type="text" id="extra" aria-label="買い物を追加" placeholder="牛乳など、買うものを追加" maxlength="80" required><button class="btn" type="submit">追加</button></form><details class="panel" ${done.length?'open':''}><summary>✓ 購入済み（${done.length}品）<span class="summary-help">押すと一覧を開けます</span></summary>${done.map(row).join('')}</details><p class="sub">主食は必要に応じて買い物メモに追加してください。</p>`;document.querySelector('#addform').onsubmit=e=>{e.preventDefault();state.extras.push(document.querySelector('#extra').value.trim());save();renderShop();toast('買い物メモに追加しました')}}
function row(x){return `<button class="listrow ${state.bought[x.id]?'bought':''}" onclick="buy('${x.id}')" aria-label="${esc(x.n)}を${state.bought[x.id]?'未購入に戻す':'購入済みにする'}"><span class="circle">${state.bought[x.id]?'✓':''}</span><span class="itemname">${esc(x.n)}</span><span class="qty">${x.q}</span></button>`}function buy(k){const item=groceries().find(x=>x.id===k);state.bought[k]=!state.bought[k];if(state.bought[k]&&item)state.purchasedItems[k]={...item};save();renderShop()}

const pantryAliases={pork:['豚ひき肉','豚挽き肉','豚ミンチ'],salmon:['鮭','サーモン','さけ'],spinach:['ほうれん草','ほうれんそう','ホウレンソウ'],onion:['玉ねぎ','玉葱','たまねぎ','タマネギ'],eggplant:['ナス','なす','茄子'],mushroom:['しいたけ','椎茸','シイタケ'],sweet:['さつまいも','サツマイモ','さつま芋'],tofu:['豆腐','とうふ'],egg:['卵','たまご','タマゴ'],tomato:['トマトピューレ','トマトピュレ']};

function pantryFit(r){const ids=Object.keys(r.ing),missing=ids.filter(k=>!state.pantry.includes(k));return {have:ids.length-missing.length,missing};}

function changeCandidates(role){const choices=new Set(state.priorityChoices),cuisines=['japanese','western','chinese','italian','korean','thai','indian'].filter(c=>choices.has(c));let pool=recipes.map((r,id)=>({r,id})).filter(x=>x.r.role===role);if(cuisines.length)pool=pool.filter(x=>cuisines.includes(x.r.cuisine));for(const k of ['soft','quick'])if(choices.has(k)){const fit=pool.filter(x=>k==='soft'?x.r.tags.includes('soft'):x.r.minutes<=15);if(fit.length)pool=fit;}return pool.sort((a,b)=>pantryScore(b.r)-pantryScore(a.r)||a.id-b.id);}

function generateMenu(){rememberPurchases();const boughtFoods=purchaseFoods();const choices=new Set(state.priorityChoices);const cuisines=['japanese','western','chinese','italian','korean','thai','indian'].filter(c=>choices.has(c));let mains=recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='main'),sides=recipes.map((r,id)=>({r,id})).filter(x=>x.r.role==='side');let notices=[];
 if(cuisines.length){mains=mains.filter(x=>cuisines.includes(x.r.cuisine));sides=sides.filter(x=>cuisines.includes(x.r.cuisine));}

 const selectedN=Object.keys(nutrientKeys).filter(k=>choices.has(k));let used={},usedVeg=new Set();let pairs=[];const offset=state.generation++;
 const score=(x,day)=>{const ids=Object.keys(x.r.ing);return pantryScore(x.r)+(state.preferBought?ids.filter(k=>boughtFoods.has(k)).length*5:0)+(state.preferFavorites&&state.favoriteIds.includes(x.id)?3:0)-8*(used[x.id]||0)+selectedN.filter(k=>nutrientKeys[k](x.r)).length*3+(choices.has('balance')?((x.r.role==='side'&&x.r.ing.sweet)?4:Object.keys(x.r.ing).some(k=>['spinach','onion','eggplant','mushroom','tomato'].includes(k))?1:0):0)+(choices.has('useStock')?ids.filter(k=>state.pantry.includes(k)).length*2:0)+(choices.has('fewFoods')?ids.filter(k=>usedVeg.has(k)).length*2:0)+((x.id+offset+day)%7)/10;};

function planInfo(){const names=priorityGroups.flatMap(g=>g[1]).filter(([id])=>state.priorityChoices.includes(id)).map(x=>x[1]);return '<div class="panel plan-panel"><div class="section-kicker">献立づくり</div><h2>この条件で、今週のごはんを。</h2><p class="sub">家の食材を優先し、選んだ条件から登録レシピを組み合わせます。</p><div class="strip">'+names.map(n=>'<span class="chip">'+n+'</span>').join('')+'</div><label class="check"><input type="checkbox" '+(state.preferBought?'checked':'')+' onchange="state.preferBought=this.checked;save()">買った食材を優先</label><label class="check"><input type="checkbox" '+(state.preferFavorites?'checked':'')+' onchange="state.preferFavorites=this.checked;save()">お気に入りを優先</label><button class="btn primary" onclick="confirmGeneration()">この条件で献立を作る →</button><p class="sub">固定した日はそのまま。購入チェック・買う量の変更は引き継ぎます。購入済みでも不足しないかは、ご自身で確認してください。</p>'+state.menuNotices.map(n=>'<p class="note">'+n+'</p>').join('')+'</div>';}
function confirmGeneration(){modal('献立を組み直す','<h2>選んだ条件で献立を作る</h2><p>固定していない日の献立を組み直します。購入済み品、買う量の変更、追加した買い物、調理チェックは残ります。</p><button class="btn primary" onclick="document.querySelector(\'dialog\').close();generateMenu()">献立を作る</button>');}
function groceries(){let total={};activeRecipeIds().forEach(id=>Object.entries(recipes[id].ing).forEach(([k,v])=>total[k]=(total[k]||0)+v*state.people/2));const items=Object.entries(total).filter(([k])=>!state.pantry.includes(k)).map(([k,v])=>({id:k,n:foods[k][0],q:Math.ceil(v)+foods[k][1],cat:foods[k][2]})).concat(state.extras.map((n,i)=>({id:'extra'+i,n,q:'',cat:'追加したもの'})),state.seasonItems.map(s=>({id:'s'+seasonNames.indexOf(s),n:s,q:'必要な分',cat:'調味料'}))).map(x=>({...x,q:state.quantityOverrides[x.id]??(state.bought[x.id]&&state.purchasedItems[x.id]?state.purchasedItems[x.id].q:x.q)}));for(const [id,item] of Object.entries(state.purchasedItems))if(state.bought[id]&&!items.some(x=>x.id===id))items.push({...item,q:state.quantityOverrides[id]??item.q,unused:true});return items;}
function row(x){return `<div class="shop-row"><button class="listrow ${state.bought[x.id]?'bought':''}" onclick="buy('${x.id}')" aria-label="${esc(x.n)}を${state.bought[x.id]?'未購入に戻す':'購入済みにする'}"><span class="circle">${state.bought[x.id]?'✓':''}</span><span class="itemname">${esc(x.n)}${x.unused?'<small class="sub">（選んだ料理では未使用）</small>':''}</span><span class="qty">${esc(x.q)}<small>${state.bought[x.id]?'戻す':'購入チェック'}</small></span></button><button class="btn qty-edit" onclick="editQuantity('${x.id}')" aria-label="${esc(x.n)}の数量を変更">数量を変更</button></div>`;}
function editQuantity(id){const x=groceries().find(x=>x.id===id);modal('買う量を変更',`<h2>${esc(x.n)}</h2><form id="quantityform"><label class="field">買う量・単位<input id="quantity" type="text" value="${esc(x.q)}" placeholder="例：1パック、300g、2袋" maxlength="60" required></label><p class="sub">買い物メモだけを変更します。レシピの材料・分量は変わりません。</p><button class="btn primary">保存</button><button class="btn" type="button" onclick="delete state.quantityOverrides['${id}'];save();document.querySelector('dialog').close();renderShop()">元の量に戻す</button></form>`);document.querySelector('#quantityform').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#quantity').value.trim();if(!q)return;state.quantityOverrides[id]=q;save();document.querySelector('dialog').close();renderShop();toast('買う量を変更しました');};}

function swap(i){if(state.lockedDays&&state.lockedDays[i]){toast('先に固定を解除してください');return;}modal('献立を変更',`<h2>${'月火水木金土日'[i]}曜日の料理を選ぶ</h2><form id="swapform"><label class="field">主菜<select id="mainchoice">${candidateOptions('main',state.week[i][0])}</select></label><label class="field">副菜<select id="sidechoice">${candidateOptions('side',state.week[i][1])}</select></label><p class="sub">家の食材を使う料理から順に、選んだ好み・調理条件に合わせて表示しています。候補がない条件は緩めています。調味料は別途確認してください。数量変更と購入チェックは引き継ぎます。</p><button class="btn primary">この献立にする</button></form>`);document.querySelector('#swapform').onsubmit=e=>{e.preventDefault();rememberPurchases();state.week[i]=[Number(document.querySelector('#mainchoice').value),Number(document.querySelector('#sidechoice').value)];state.menuNotices=['献立を手動で変更しました。選択した条件を満たすか、作り方を確認してください。'];save();document.querySelector('dialog').close();render();toast('献立と買い物メモを更新しました');};}

function rememberPurchases(){const all=groceries();for(const x of all)if(state.bought[x.id])state.purchasedItems[x.id]={...x};save();}
function purchaseFoods(){return new Set([...Object.keys(state.bought).filter(k=>state.bought[k]),...Object.keys(state.purchasedItems).filter(k=>state.bought[k])].filter(k=>foods[k]));}
function toggleLock(i){state.lockedDays[i]=!state.lockedDays[i];save();renderWeek();toast(state.lockedDays[i]?'この日の献立を固定しました':'固定を解除しました');}
function favoriteButton(id){const on=state.favoriteIds.includes(id);return `<button type="button" class="btn favorite-toggle ${on?'selected':''}" aria-pressed="${on}" onclick="toggleFavorite(${id},this)">${on?'♥ お気に入り済み':'♡ お気に入りに保存'}</button>`;}

function chooseFavoriteDay(id){modal('お気に入りを献立に入れる',`<h2>${recipes[id].n}</h2><p class="sub">入れたい日を選んでください。固定した日は、献立画面で固定を解除してから変更できます。</p><div class="priority-options">${state.week.slice(0,state.days).map((pair,i)=>`<button class="btn" ${state.lockedDays[i]?'disabled':''} onclick="placeFavorite(${id},${i})">${'月火水木金土日'[i]}${state.lockedDays[i]?' 🔒':''}</button>`).join('')}</div>`);}

function formatAmount(n){const whole=Math.floor(n),part=Math.round((n-whole)*100)/100;const fractions={0.25:'1/4',0.5:'1/2',0.75:'3/4'};return fractions[part]?(whole?whole+'と':'')+fractions[part]:String(Math.round(n*100)/100);}
function scaledSeason(r){return r.season.replace(/\d+(?:\/\d+|\.\d+)?/g,text=>{const parts=text.split('/');const n=parts.length===2?Number(parts[0])/Number(parts[1]):Number(text);return formatAmount(n*state.people/2);});}

function activeRecipeIds(){return state.ideaSelection||[];}
function ideaPool(options={}){const choices=new Set(state.priorityChoices),cuisines=['japanese','western','chinese','italian','korean','thai','indian'].filter(c=>choices.has(c));let pool=recipes.map((r,id)=>({r,id}));if(cuisines.length)pool=pool.filter(x=>cuisines.includes(x.r.cuisine));if(!options.allRoles&&state.ideaFilter!=='all')pool=pool.filter(x=>x.r.role===state.ideaFilter);if(choices.has('quick')||choices.has('lowEffort'))pool=pool.filter(x=>x.r.minutes<=15);if(choices.has('microwave'))pool=pool.filter(x=>x.r.kind==='レンジ');if(choices.has('onePan'))pool=pool.filter(x=>x.r.kind==='コンロ');if(choices.has('soft'))pool=pool.filter(x=>x.r.tags.includes('soft'));if(state.ideaOnlyPantry)pool=pool.filter(x=>!pantryFit(x.r).missing.length);const nut=r=>Object.entries({protein:['pork','salmon','egg','tofu'],vitaminD:['salmon','mushroom','egg'],iron:['spinach','tofu','egg'],calcium:['tofu','spinach'],fiber:['spinach','onion','eggplant','mushroom','sweet']}).filter(([key,ids])=>choices.has(key)&&ids.some(k=>r.ing[k])).length*3+(choices.has('muscle')&&r.role==='main'&&Object.keys(r.ing).some(k=>['pork','salmon','egg','tofu'].includes(k))?5:0)+(choices.has('moreVeg')?Object.keys(r.ing).filter(k=>['spinach','onion','eggplant','mushroom','tomato'].includes(k)).length*3:0)+['light','hearty','comfort','refresh','spicy'].filter(k=>choices.has(k)&&r.tags.includes(k)).length*4+(choices.has('folate')&&r.ing.spinach?3:0)+(choices.has('vitamins')&&(r.ing.spinach||r.ing.sweet||r.ing.salmon||r.ing.tomato)?3:0)+(choices.has('zinc')&&(r.ing.pork||r.ing.egg)?3:0);return pool.sort((a,b)=>Number(!pantryFit(b.r).missing.length)-Number(!pantryFit(a.r).missing.length)||pantryScore(b.r)+nut(b.r)-pantryScore(a.r)-nut(a.r)||((a.id+state.ideaOffset)%recipes.length)-((b.id+state.ideaOffset)%recipes.length));}
function filterIdeas(key,value){state[key]=value;save();renderWeek();}
function selectIdea(id){if(!recipes[id])return;rememberPurchases();state.selectionUndo=state.ideaSelection.slice();if(state.ideaSelection.includes(id)){state.ideaSelection=state.ideaSelection.filter(x=>x!==id);}else state.ideaSelection.push(id);save();render();if(document.querySelector('#modal').open)recipe(id);toast(state.ideaSelection.includes(id)?'不足分を買い物メモにまとめておきました':'選択を外し、買い物メモも整えました');}
function ideaSelectionButton(id){const on=state.ideaSelection.includes(id);return `<button class="btn ${on?'selected-idea':'primary'}" aria-pressed="${on}" onclick="selectIdea(${id})">${on?'✓ 選択済み・外す':'＋ これを作る'}</button>`;}
function ideaCard({r,id}){const f=pantryFit(r);return `<article class="panel idea-card"><button class="art-open" onclick="recipe(${id})" aria-label="${r.n}の作り方を見る">${dishArt(id)}</button><div class="strip"><span class="label ${r.role==='main'?'main-label':'side-label'}">${r.role==='main'?'主菜':'副菜'}</span><span class="sub">${r.kind} · 約${r.minutes}分</span></div><button class="dish" onclick="recipe(${id})">${r.n} ›</button><p class="idea-fit ${!f.missing.length?'fit-ready':''}">${!f.missing.length?'✓ 家の食材で作れる':'＋ 買い足し：'+f.missing.map(k=>foods[k][0]).join('、')}</p><p class="sub">${f.have?'家にある：'+Object.keys(r.ing).filter(k=>state.pantry.includes(k)).map(k=>foods[k][0]).join('、'):'材料を買い足せば作れます'}</p><div class="actions">${ideaSelectionButton(id)}<button class="textbtn" onclick="recipe(${id})">作り方を見る</button></div></article>`;}
function showLegacyMenu(){modal('以前の週間献立',`<p class="sub">前の献立は記録として残しています。買い物メモは、今選んだ料理から作ります。</p>${state.week.slice(0,state.days).map(([a,b],i)=>`<div class="panel"><strong>${'月火水木金土日'[i]}曜日</strong><button class="dish" onclick="recipe(${a})">${recipes[a].n} ›</button><button class="dish" onclick="recipe(${b})">${recipes[b].n} ›</button></div>`).join('')}`);}
function renderWeek(){const pool=ideaPool(),selected=state.ideaSelection.map(id=>({r:recipes[id],id})),labels=priorityGroups.flatMap(g=>g[1]).filter(([id])=>state.priorityChoices.includes(id)&&!['parallel','twoDishes','balance','fewFoods','useStock','oneMeatFish'].includes(id)).map(x=>x[1]);app.innerHTML=head('TODAY’S IDEAS','今日、なに作ろう？','家の食材から、いま食べたい一品を。','')+`<figure class="window-card idea-window"><img src="./yorimichi-window.jpg" width="1536" height="768" alt="青空を眺める女性と猫、あたたかな食卓"><figcaption class="window-caption">予定にしばられず、今日の気分で。</figcaption></figure><section class="panel plan-panel"><div class="actions"><h2>わが家の食材と希望</h2><button class="btn" onclick="go('settings')">食材・条件を変える</button></div><p>${currentPantryNames().length?currentPantryNames().map(esc).join('、'):'家の食材を登録すると、作れる料理を見つけやすくなります。'}</p><div class="strip"><span class="chip">${state.people}人分</span>${labels.map(n=>'<span class="chip">'+n+'</span>').join('')}</div><p class="sub">登録レシピから提案します。家の食材がそろう料理を優先。数量・調味料は別途確認してください。栄養の希望は食材をもとに優先し、栄養量は計算しません。</p></section>${preparationPanel()}${selected.length?`<section class="panel chosen-panel"><h2>いま、作りたい料理 <span class="chip">${selected.length}品</span></h2>${selected.map(({r,id})=>`<div class="chosen-row"><button class="dish" onclick="recipe(${id})">${r.n} ›</button><button class="textbtn" onclick="selectIdea(${id})" aria-label="${r.n}の選択を外す">外す</button></div>`).join('')}<p class="sub">気分が変わったら、いつでも選び直せます。</p></section>`:''}${suggestionPanel()}<section aria-label="料理の候補"><h2>こんな料理はどう？ <span class="chip">${pool.length}品</span></h2><div class="idea-tools"><div class="priority-options">${[['all','すべて'],['main','主菜'],['side','副菜']].map(([k,n])=>`<button class="btn ${state.ideaFilter===k?'selected-idea':''}" aria-pressed="${state.ideaFilter===k}" onclick="filterIdeas('ideaFilter','${k}')">${n}</button>`).join('')}</div><label class="check"><input type="checkbox" ${state.ideaOnlyPantry?'checked':''} onchange="filterIdeas('ideaOnlyPantry',this.checked)">家の食材で作れるものだけ</label></div><p class="sub">料理をタップして作り方へ。「これを作る」で不足分を買い物メモに追加します。</p><div class="idea-grid">${pool.length?pool.map(ideaCard).join(''):'<div class="panel"><h3>この条件に合う料理がまだありません</h3><p>「家の食材で作れるものだけ」を外すか、食材・料理の好み・時短などの条件を変えてみてください。</p><button class="btn" onclick="go(\'settings\')">食材・条件を変える</button></div>'}</div></section><p class="sub">主菜と副菜を選んで組み合わせても、一品だけでも。主食などを含め食事全体で調整してください。</p><button class="textbtn" onclick="showLegacyMenu()">以前の週間献立を見る</button>`;}
function chooseFavoriteDay(id){if(!state.ideaSelection.includes(id))selectIdea(id);else toast('すでに作りたい料理に選んでいます');}
function recipe(id){const r=recipes[id];modal('作り方',`<span class="chip">${r.kind} · 約${r.minutes}分 · ${state.people}人分</span><h1>${r.n}</h1>${dishArt(id,true)}<div class="actions">${ideaSelectionButton(id)}${favoriteButton(id)}</div><h3>材料</h3>${ingredients(r)}<div class="panel"><h3>調味料（${state.people}人分）</h3><p>${scaledSeason(r)}</p></div><h3>作り方</h3>${cookSteps('idea:'+id+':'+state.people,r.steps.map((s,i)=>['手順 '+(i+1),s]))}<p class="note">${r.tip}</p>${safety}`);}


function priorityFields(){const nutrientIds=['folate','vitamins','zinc','protein','vitaminD','iron','calcium','fiber'];const field=(group,options)=>'<fieldset class="priority-group"><legend>'+group+'</legend><div class="priority-options">'+options.map(([id,label])=>'<label class="priority-option"><input type="checkbox" name="priorityChoice" value="'+id+'" '+(state.priorityChoices.includes(id)?'checked':'')+'><span>'+label+'</span></label>').join('')+'</div></fieldset>';return priorityGroups.filter(([g])=>g!=='買い物を少なく').map(([g,opts])=>field(g,opts.filter(([id])=>!['parallel','twoDishes','balance',...nutrientIds].includes(id)))).join('')+'<details class="panel" '+(state.priorityChoices.some(x=>nutrientIds.includes(x))?'open':'')+'><summary>栄養素から詳しく選ぶ（学習にも）</summary>'+field('意識したい栄養素',priorityGroups.flatMap(g=>g[1]).filter(([id])=>nutrientIds.includes(id)))+'</details><p class="note">「筋肉をつけたい」は肉・魚・卵・豆腐を含む主菜を、「野菜を増やしたい」は野菜の種類を優先します。「料理の負担を減らしたい」は15分以内、「レンジ中心」「フライパン1つ」は調理器具で絞ります。軽め・しっかり・味の希望は候補の並び順に反映。栄養量や健康への効果を保証するものではありません。</p>';}

egg:{group:'赤',nut:['たんぱく質','脂質','ビタミンB2'],work:'たんぱく質は体の組織の材料。ビタミンB2はエネルギー代謝を助けます。',exam:'卵黄と卵白で成分が違う。卵はたんぱく質食品だが、食品一つで全栄養素がそろうわけではない。',item:'12_12004_7',ref:'鶏卵・全卵・生'},

function lessonBody(k){const x=foodLessons[k];if(!x)return '';const url=x.item?'https://fooddb.mext.go.jp/details/details.pl?ITEM_NO='+x.item:'https://fooddb.mext.go.jp/';return `<div class="food-learning"><span class="food-group group-${x.group}">${x.group}：${{赤:'体をつくるもと',黄:'エネルギーのもと',緑:'体の調子を整えるもと'}[x.group]}</span><h4>学習で注目する成分</h4><p>${x.nut.join('・')}</p><h4>栄養素の働き</h4><p>${x.work}</p><h4>保育士試験の基礎整理</h4><p>${x.exam}</p><p class="sub">食品を一つの栄養素だけで捉えず、食事全体で組み合わせます。料理全体の含有量・摂取量は計算していません。</p><p class="sub">参照する食品：${x.ref}。品種・製品・加熱で成分は変わります。ここでは一般的な特徴を紹介しています。</p><div class="learning-sources"><a href="${url}" target="_blank" rel="noopener noreferrer">文部科学省：食品成分データベース${x.item?'・該当食品':'（食品名で検索）'} ↗</a><a href="https://www.maff.go.jp/j/syokuiku/zissen_navi/balance/guide.html" target="_blank" rel="noopener noreferrer">農林水産省：食品群と栄養 ↗</a><a href="https://kennet.mhlw.go.jp/information/information/dictionary/food/ye-027.html" target="_blank" rel="noopener noreferrer">厚生労働省：ビタミンの働き ↗</a></div><p class="sub">資料確認：2026年10月</p></div>`;}
function ingredients(r){return '<p class="sub">食材をタップして、栄養と学習ポイントを確認できます。</p>'+Object.entries(r.ing).map(([k,v])=>`<details class="ingredient-lesson"><summary><span>${foods[k][0]}<small> 栄養・学習ポイント ▾</small></span><span class="qty">${Math.ceil(v*state.people/2)}${foods[k][1]}</span></summary>${lessonBody(k)}</details>`).join('');}
function artTile(id){if(id>=44)return id-33;const base=id%11;if(recipes[id].cuisine==='italian'&&recipes[id].role==='main'&&base===1)return 15;if(recipes[id].cuisine==='italian'&&[0,3,6].includes(base))return 14;return base;}
function dishArt(id,large=false){const tile=artTile(id);return `<figure class="dish-figure ${large?'large':''}"><div class="dish-art" role="img" aria-label="${esc(recipes[id].n)}の食材をもとにした盛りつけイメージ" style="background-position:${tile%4*100/3}% ${Math.floor(tile/4)*100/3}%"></div><figcaption>AIによる盛りつけイメージ${id>=11&&id<44?'（味付け違いは共通の絵を使用）':''}</figcaption></figure>`;}


function suggestionContext(){return JSON.stringify([state.ideaSelection.slice().sort((a,b)=>a-b),state.pantry.slice().sort(),state.priorityChoices.slice().sort(),state.ideaOnlyPantry]);}
function sharedSuggestion(){if(!state.ideaSelection.length||state.suggestionDismissed===suggestionContext())return null;const selected=state.ideaSelection.map(id=>recipes[id]),used=new Set(selected.flatMap(r=>Object.keys(r.ing))),available=new Set([...state.pantry,...used]);const signature=r=>r.role+':'+Object.keys(r.ing).sort().join(',');const same=new Set(selected.map(signature));const ranked=ideaPool({allRoles:true}).filter(({r,id})=>!state.ideaSelection.includes(id)&&!same.has(signature(r))).map(x=>({...x,shared:Object.keys(x.r.ing).filter(k=>used.has(k)),extra:Object.keys(x.r.ing).filter(k=>!available.has(k))})).filter(x=>x.shared.length>0);ranked.sort((a,b)=>a.extra.length-b.extra.length||b.shared.length-a.shared.length);return ranked[0]||null;}
function dismissSuggestion(){state.suggestionDismissed=suggestionContext();save();renderWeek();}
function undoSelection(){if(!Array.isArray(state.selectionUndo))return;rememberPurchases();state.ideaSelection=state.selectionUndo.filter(id=>recipes[id]);delete state.selectionUndo;save();render();if(document.querySelector('#modal').open)document.querySelector('#modal').close();toast('直前の料理の選択に戻しました');}
function preparationPanel(){if(!state.ideaSelection.length&&!Array.isArray(state.selectionUndo))return '';const ingredients=groceries().filter(x=>foods[x.id]&&!x.unused),left=ingredients.filter(x=>!state.bought[x.id]);return `<section class="panel prepared-panel" aria-label="準備しておいたこと"><div class="section-kicker">${state.ideaSelection.length?'用意しておいたよ':'選択を変更しました'}</div><h2>${state.ideaSelection.length?'不足する食材をまとめました':'作りたい料理は、また選べます'}</h2>${state.ideaSelection.length?`<p>${left.length?'買う食材は '+left.length+'種類。重なる材料は合算しています。':'未購入の食材はありません。家にある分や購入済み分の量を確認してください。'}</p><p class="sub">調味料の一覧も準備しています。家にないものだけ追加できます。</p><button class="btn primary" onclick="go('shop')">必要なら買い物メモを見る →</button>`:''}${Array.isArray(state.selectionUndo)?'<button class="textbtn" onclick="undoSelection()">直前の選択を元に戻す</button>':''}</section>`;}
function suggestionPanel(){const x=sharedSuggestion();if(!x)return '';return `<aside class="panel gentle-suggestion" aria-label="同じ食材でもう一品"><div class="suggestion-heading"><div><div class="section-kicker">必要なら、こんな一品も</div><h2>明日にも、同じ食材で。</h2></div><button class="textbtn" onclick="dismissSuggestion()" aria-label="この提案を閉じる">閉じる</button></div><div class="suggestion-content"><button class="art-open" onclick="recipe(${x.id})" aria-label="${x.r.n}の作り方を見る">${dishArt(x.id)}</button><div><button class="dish" onclick="recipe(${x.id})">${x.r.n} ›</button><p class="sub">${x.shared.map(k=>foods[k][0]).join('・')}を共用できます。</p><p class="sub">${x.extra.length?'ほかに必要な食材：'+x.extra.map(k=>foods[k][0]).join('、'):'選んだ料理の食材と、家の食材で組み合わせられます。'}</p><p class="sub">残る量は未計算。必要量と調味料はレシピで確認できます。</p><button class="btn" onclick="selectIdea(${x.id})">＋ これも作る</button><p class="sub">押したときだけ、選んだ料理と買い物メモに追加します。</p></div></div></aside>`;}


var pantryEditor=null;
function foodKeyForName(name){const text=name.normalize('NFKC');return Object.keys(pantryAliases).find(k=>pantryAliases[k].some(alias=>text.includes(alias)))||null;}
function parseFoodMemo(text){const entries=String(text).normalize('NFKC').replace(/冷凍[：:]/g,'').split(/[、,\n・;；]+/),result=[];for(let entry of entries){entry=entry.trim();if(!entry||/(?:なし|無し|在庫切れ|使い切った)$/.test(entry))continue;entry=entry.replace(/^[\s\-*●・]+/,'').trim();let amount='';const amountMatch=entry.match(/(?:約\s*)?\d+(?:\.\d+|\/\d+)?\s*(?:回分|人分|パック|袋|個|本|枚|切れ|kg|g|ml|mL|L|玉|束|缶|丁)(?:\s*(?:半|弱|強))?$|(?:少量|半分|半袋|半パック|残り少し)$/);if(amountMatch){amount=amountMatch[0];entry=entry.slice(0,amountMatch.index).trim();}if(!entry)continue;const name=entry.slice(0,80),normalized=name.replace(/\s+/g,'').toLowerCase(),existing=result.find(x=>x.normalized===normalized);if(existing){if(amount)existing.amount=amount;continue;}result.push({name,amount,normalized,foodKey:foodKeyForName(name),active:!/^0(?:\s|回|人|パック|袋|個|本|枚|切|kg|g|ml|mL|L|玉|束|缶|丁)/.test(amount)});}return result;}
function ensureFoodHistory(){if(!Array.isArray(state.foodHistory)){const items=parseFoodMemo(state.stock||'');state.foodHistory=items.map((x,i)=>({id:'h'+i,name:x.name,amount:x.amount,normalized:x.normalized,foodKey:x.foodKey}));state.foodHistorySelected=state.foodHistory.filter(x=>!x.foodKey||state.pantry.includes(x.foodKey)).map(x=>x.id);for(const k of state.pantry){if(!state.foodHistory.some(x=>x.foodKey===k)){const name=foods[k]?.[0];if(name){const id='h'+state.foodHistory.length;state.foodHistory.push({id,name,amount:'',normalized:name.replace(/\s+/g,''),foodKey:k});state.foodHistorySelected.push(id);}}}save();}if(!Array.isArray(state.foodHistorySelected))state.foodHistorySelected=[];}
function startPantryEditor(){ensureFoodHistory();pantryEditor={history:structuredClone(state.foodHistory),selected:state.foodHistorySelected.slice(),draft:[]};}
function currentPantryNames(){if(Array.isArray(state.foodHistory)&&Array.isArray(state.foodHistorySelected))return state.foodHistory.filter(x=>state.foodHistorySelected.includes(x.id)).map(x=>x.name+(x.amount?' '+x.amount:''));return state.pantry.map(k=>foods[k]?.[0]||k);}
function pantryEditorHTML(){return `<section class="panel"><h2>家にある食材</h2><p class="sub">メモを貼り付けると食材ごとのボタンになります。保存した食材は、次回から履歴で選ぶだけ。</p><label class="field">食材メモから追加<textarea id="stock" oninput="previewFoodMemo()" placeholder="例：豚ひき肉3回分、白菜、揚げナス、豚こま肉4回分"></textarea></label><div id="food-preview" aria-live="polite"></div><div id="food-history-editor">${foodHistoryHTML()}</div><p class="note">選んだ食材・量と履歴は、下の「保存してアイデアを見る」で保存します。量はメモ用です。未対応の食材も保存できますが、今のレシピ候補には使われません。</p></section>`;}
function foodHistoryHTML(){const e=pantryEditor;return `<div class="actions"><h3>履歴から選ぶ <span class="chip">${e.history.length}種類</span></h3><button type="button" class="textbtn" onclick="clearFoodSelection()">今ある食材の選択をすべて外す</button></div><p class="sub">✓ が付いた食材が「今、家にあるもの」です。もう一度押すと外せます。</p><div class="food-history-chips">${e.history.map((x,i)=>`<button type="button" class="food-history-chip ${e.selected.includes(x.id)?'selected-idea':''}" aria-pressed="${e.selected.includes(x.id)}" onclick="toggleHistoryFood(${i})"><span>${e.selected.includes(x.id)?'✓':'＋'} ${esc(x.name)}</span>${x.amount?'<small>'+esc(x.amount)+'</small>':''}${!x.foodKey?'<small class="unsupported-food">レシピ候補は未対応</small>':''}</button>`).join('')}</div>${e.selected.length?'<h3>選んだ食材の量（任意）</h3>'+e.history.filter(x=>e.selected.includes(x.id)).map(x=>{const i=e.history.indexOf(x);return `<label class="food-amount-row"><span>${esc(x.name)}</span><input type="text" maxlength="40" value="${esc(x.amount)}" placeholder="例：3回分、少量" aria-label="${esc(x.name)}の残っている量" oninput="editHistoryAmount(${i},this.value)"></label>`;}).join(''):'<p class="sub">まだ食材が選ばれていません。</p>'}`;}
function previewFoodMemo(){pantryEditor.draft=parseFoodMemo(document.querySelector('#stock').value);renderFoodPreview();}
function renderFoodPreview(){const e=pantryEditor;document.querySelector('#food-preview').innerHTML=e.draft.length?'<h3>入力から読み取った食材</h3><p class="sub">保存すると履歴に追加され、今ある食材として選択されます。不要なものは押して外せます。</p><div class="food-history-chips">'+e.draft.map((x,i)=>`<button type="button" class="food-history-chip ${x.active?'selected-idea':''}" aria-pressed="${x.active}" onclick="toggleDraftFood(${i})"><span>${x.active?'✓':'＋'} ${esc(x.name)}</span>${x.amount?'<small>'+esc(x.amount)+'</small>':''}${!x.foodKey?'<small class="unsupported-food">レシピ候補は未対応</small>':''}</button>`).join('')+'</div>':'';}
function toggleDraftFood(i){pantryEditor.draft[i].active=!pantryEditor.draft[i].active;renderFoodPreview();}
function toggleHistoryFood(i){const id=pantryEditor.history[i].id;pantryEditor.selected=pantryEditor.selected.includes(id)?pantryEditor.selected.filter(x=>x!==id):[...pantryEditor.selected,id];document.querySelector('#food-history-editor').innerHTML=foodHistoryHTML();}
function clearFoodSelection(){pantryEditor.selected=[];pantryEditor.draft.forEach(x=>x.active=false);document.querySelector('#food-history-editor').innerHTML=foodHistoryHTML();renderFoodPreview();}
function editHistoryAmount(i,value){pantryEditor.history[i].amount=value.slice(0,40);}
function commitPantryEditor(){const e=pantryEditor;for(const x of e.draft.filter(x=>x.active)){let entry=e.history.find(h=>h.normalized===x.normalized||h.name.replace(/\s+/g,'').toLowerCase()===x.normalized);if(entry){if(x.amount)entry.amount=x.amount;}else{let n=e.history.length;while(e.history.some(h=>h.id==='h'+n))n++;entry={id:'h'+n,name:x.name,amount:x.amount,normalized:x.normalized,foodKey:x.foodKey};e.history.push(entry);}if(!e.selected.includes(entry.id))e.selected.push(entry.id);}state.foodHistory=e.history;state.foodHistorySelected=e.selected;const selected=e.history.filter(x=>e.selected.includes(x.id));state.pantry=[...new Set(selected.map(x=>x.foodKey).filter(Boolean))];state.stock=selected.map(x=>x.name+(x.amount?' '+x.amount:'')).join('、');}

render();
</script></body></html>
